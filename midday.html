                        text: "The Lord is king, he is robed in majesty; the Lord is robed, he is girded with strength... Your decrees are very sure; holiness befits your house, O Lord, forevermore."
                    }
                ]
            },
            {
                day: "Friday Week 4",
                antiphon: "The Lord is king, he is robed in majesty.",
                psalms: [
                    {
                        ref: "Psalm 94",
                        text: "O Lord, God of vengeance, O God of vengeance, shine forth!... If the Lord had not been my help, my soul would soon have lived in the land of silence."
                    },
                    {
                        ref: "Psalm 95",
                        text: "O come, let us sing to the Lord; let us make a joyful noise to the rock of our salvation!... O that today you would listen to his voice! Do not harden your hearts, as at Meribah, as on the day at Massah in the wilderness."
                    },
                    {
                        ref: "Psalm 96",
                        text: "O sing to the Lord a new song; sing to the Lord, all the earth... Say among the nations, 'The Lord is king! The world is firmly established; it shall never be moved.'"
                    }
                ]
            },
            {
                day: "Saturday Week 4",
                antiphon: "O come, let us sing to the Lord; let us make a joyful noise to the rock of our salvation!",
                psalms: [
                    {
                        ref: "Psalm 97",
                        text: "The Lord is king! Let the earth rejoice; let the many coastlands be glad!... Light dawns for the righteous, and joy for the upright in heart."
                    },
                    {
                        ref: "Psalm 98",
                        text: "O sing to the Lord a new song, for he has done marvelous things... Let the sea roar, and all that fills it; the world and those who live in it."
                    },
                    {
                        ref: "Psalm 99",
                        text: "The Lord is king; let the peoples tremble! He sits enthroned upon the cherubim; let the earth quake!... Extol the Lord our God, and worship at his holy mountain; for the Lord our God is holy."
                    }
                ]
            },
            {
                day: "Sunday Week 4",
                antiphon: "The Lord is king! Let the earth rejoice; let the many coastlands be glad!",
                psalms: [
                    {
                        ref: "Psalm 100",
                        text: "Make a joyful noise to the Lord, all the earth!... For the Lord is good; his steadfast love endures forever, and his faithfulness to all generations."
                    },
                    {
                        ref: "Psalm 101",
                        text: "I will sing of loyalty and of justice; to you, O Lord, I will sing... I will look with favor on the faithful in the land, so that they may live with me."
                    },
                    {
                        ref: "Psalm 102",
                        text: "Hear my prayer, O Lord; let my cry come to you... But you, O Lord, are enthroned forever; your name endures to all generations."
                    }
                ]
            }
        ];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            const navContainer = document.getElementById('navigation');
            const psalmContainer = document.getElementById('psalm-container');
            let currentDay = 0;
            
            // Create navigation buttons
            psalmData.forEach((psalm, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = psalm.day;
                btn.dataset.index = index;
                btn.addEventListener('click', () => showPsalm(index));
                navContainer.appendChild(btn);
            });
            
            // Show the first day by default
            showPsalm(0);
            
            // Function to display psalm content
            function showPsalm(index) {
                currentDay = index;
                const data = psalmData[index];
                
                // Update active button
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`.nav-btn[data-index="${index}"]`).classList.add('active');
                
                // Build HTML content
                let content = `
                    <div class="psalm-header">
                        <div class="psalm-title">${data.day}</div>
                        <div class="psalm-date">Midday Prayer</div>
                    </div>
                    <div class="antiphon">${data.antiphon}</div>
                    <div class="psalm-content">
                `;
                
                data.psalms.forEach(p => {
                    content += `
                        <div class="psalm-ref">${p.ref}</div>
                        <div class="psalm-text">${p.text}</div>
                    `;
                });
                
                content += `</div>`;
                psalmContainer.innerHTML = content;
                
                // Scroll to top
                window.scrollTo(0, 0);
            }
        });
    </script>
</body>
</html>
