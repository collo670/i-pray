<body class="min-h-screen bg-gradient-vintage transition-colors duration-300">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    <div id="app" class="relative z-10 page-content">
        <!-- Updated Header -->

<main class="max-w-4xl mx-auto px-6 py-8 pb-32 pt-6" role="main">
    <div class="flex justify-center items-center min-h-[60vh]">
        <div class="bg-white dark:bg-gray-800 shadow-xl rounded-3xl p-8 w-full max-w-md border border-dashed border-purple-200 dark:border-gray-700">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Welcome to ipray</h2>
                <p class="text-gray-600 dark:text-gray-400">Sign in to your account</p>
            </div>
            <form id="loginForm" class="space-y-6" novalidate>
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm" role="alert">
                    <span class="block sm:inline">Invalid username or password. Please try again.</span>
                </div>
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Username or Email</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                           placeholder="Enter your username or email">
                    <span id="usernameError" class="text-red-500 text-sm hidden">This field is required</span>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                           placeholder="Enter your password">
                    <span id="passwordError" class="text-red-500 text-sm hidden">This field is required</span>
                </div>
                <div>
                    <button type="submit" id="loginBtn"
                            class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold py-3 px-4 rounded-lg hover:from-purple-700 hover:to-pink-700 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                        Sign In
                    </button>
                </div>
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">Or</span>
                        </div>
                    </div>
                    <div class="mt-6">
                        <button id="googleSignInBtn" class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-3 px-4 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 flex items-center justify-center">
                            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Sign in with Google
                        </button>
                    </div>
                </div>
            </form>
            <div class="mt-6 text-center space-y-2">
                <a href="#" class="text-sm text-purple-600 dark:text-purple-400 hover:text-purple-800 dark:hover:text-purple-300 transition-colors">Forgot your password?</a>

                    Don't have an account? <a href="signup.html" class="text-purple-600 dark:text-purple-400 hover:text-purple-800 dark:hover:text-purple-300 transition-colors font-medium">Sign up</a>
                </div>
            </div>

</main>

    <!-- Firebase Authentication Script -->
    <script>
        // Firebase configuration - Replace with your actual config from Firebase Console
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const googleSignInBtn = document.getElementById('googleSignInBtn');

            function showError(element, message) {
                element.textContent = message;
                element.classList.remove('hidden');
            }

            function hideError(element) {
                element.classList.add('hidden');
            }

            function validateField(input, errorElement) {
                if (!input.value.trim()) {
                    showError(errorElement, 'This field is required');
                    return false;
                } else {
                    hideError(errorElement);
                    return true;
                }
            }

            usernameInput.addEventListener('blur', () => validateField(usernameInput, usernameError));
            passwordInput.addEventListener('blur', () => validateField(passwordInput, passwordError));

            // Email/Password Login
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const isUsernameValid = validateField(usernameInput, usernameError);
                const isPasswordValid = validateField(passwordInput, passwordError);

                if (isUsernameValid && isPasswordValid) {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Signing In...';

                    try {
                        await auth.signInWithEmailAndPassword(usernameInput.value, passwordInput.value);
                        window.location.href = 'index.html';
                    } catch (error) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Sign In';
                        showError(errorMessage, error.message);
                    }
                }
            });

            // Google Sign-In
            googleSignInBtn.addEventListener('click', async function() {
                try {
                    googleSignInBtn.disabled = true;
                    googleSignInBtn.textContent = 'Signing In...';
                    await auth.signInWithPopup(googleProvider);
                    window.location.href = 'index.html';
                } catch (error) {
                    googleSignInBtn.disabled = false;
                    googleSignInBtn.textContent = 'Sign in with Google';
                    showError(errorMessage, error.message);
                }
            });

            // Check if user is already logged in
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // User is signed in, redirect to index
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
