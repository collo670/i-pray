<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ipray - Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            color: #ffc107;
        }
        /* Icon styles from index.html */
        .icon-container {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }
        .icon-circle {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 4px solid #ffc107;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @media (min-width: 640px) {
            .icon-circle {
                width: 80px;
                height: 80px;
            }
        }
        @media (min-width: 768px) {
            .icon-circle {
                width: 96px;
                height: 96px;
            }
        }
    </style>
    <script src="../../js/logo-loader.js"></script>
</head>
<body>
    <h1>ipray</h1>
    <div class="icon-container">
        <div class="icon-circle">
            <img src="assets/images/bikira M.png" alt="ipray icon">
        </div>
    </div>
    <h2>You are offline</h2>
    <p>Some features may not be available. Please reconnect to access all content.</p>
    <button onclick="tryReconnect()">Try Again</button>
    <script>
      function tryReconnect() {
        if (navigator.onLine) {
          window.location.href = "index.html";
        } else {
          alert("Still offline. Please check your internet connection.");
        }
      }
    </script>
</body>
</html>
