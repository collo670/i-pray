<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7c2133">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ipray">
    <link rel="stylesheet" href="../css/prevent-zoom.css">
    <title>Liturgy of the Hours - ipray</title>
    <link rel="icon" href="../assets/images/favicon.ico.jpg" type="image/x-icon">
    <meta name="description" content="Office of Readings, Midday Prayer and Vespers (Evening Prayer) for every day, complete with saint memorials, feasts and solemnities">
    <!-- Tailwind CSS: locally built (npm run build) -->
    <link rel="stylesheet" href="../dist/output.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/index.css">
    <style>
        /* Universalis office markup (.v verse lines, .vi continuations, table.each
           section headings, rubrics…) restyled to flow with the app layout. */
        /* --prayer-text-scale is set by js/text-size.js (default 1)
           and applies to the whole rendered office - English (Universalis)
           and Swahili alike - across all three hours (Readings, Midday,
           Vespers), since every view renders into this one container. */
        .office-content { font-size: calc(1.0625rem * var(--prayer-text-scale, 1)); line-height: 1.75; color: #000000; font-weight: 600; }
        .dark .office-content { color: #d1d5db; }
        .office-content .v { margin: 0; }
        .office-content .gb { margin-top: 0.9em; }
        .office-content .vi { padding-left: 1.25rem; }
        .office-content .p, .office-content .pi { margin: 0.6em 0; }
        .office-content .v,
        .office-content .vi,
        .office-content .p,
        .office-content .pi {
            text-align: justify;
            text-justify: inter-word;
        }
        .office-content table { width: 100%; border-collapse: collapse; }
        .office-content table.each { margin: 2rem 0 0.75rem; }
        .office-content table.each th { font-weight: 400; }
        .office-content table.each th[align="left"] {
            display: inline-block; font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: #7c2133; background: rgba(124, 33, 51, 0.10);
            border-radius: 9999px; padding: 0.3rem 0.85rem;
        }
        .dark .office-content table.each th[align="left"] { color: #c4b5fd; background: rgba(124, 58, 237, 0.28); }
        .office-content table.each th[align="right"] { font-size: 0.85rem; font-style: italic; color: #6b7280; text-align: right; }
        .dark .office-content table.each th[align="right"] { color: #9ca3af; }
        .office-content th:empty, .office-content td:empty { display: none; }
        .office-content td[align="right"] { font-size: 0.85rem; font-style: italic; color: #6b7280; text-align: right; padding-top: 0.35rem; }
        .dark .office-content td[align="right"] { color: #9ca3af; }
        .office-content h4 { margin: 1.25rem 0 0.75rem; font-size: 1rem; font-weight: 700; color: #1f2937; }
        .dark .office-content h4 { color: #f3f4f6; }
        /* Heading the app itself prints above the extracted liturgy
           ("Vespers - English"), so the reader can see which hour and
           which language the text belongs to. Not from Universalis. */
        .office-hour-heading {
            margin: 0 0 1.25rem; padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(124, 33, 51, 0.18);
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em;
            text-transform: uppercase; color: #7c2133; text-align: center;
        }
        .dark .office-hour-heading { color: #c4b5fd; border-bottom-color: rgba(196, 181, 253, 0.25); }
        .office-content hr.shortrule { border: 0; border-top: 1px dashed #d1d5db; width: 4rem; margin: 1.75rem auto 0; }
        .office-content > hr.shortrule:first-child { display: none; }
        .dark .office-content hr.shortrule { border-top-color: #4b5563; }
        .office-content .rubric { font-size: 0.875rem; font-style: italic; color: #b91c1c; margin: 0.75rem 0; }
        .dark .office-content .rubric { color: #f87171; }
        .office-content .boldrubric { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; color: #b91c1c; }
        .dark .office-content .boldrubric { color: #f87171; }
        .office-content .audioclip { margin: 1.25rem 0; text-align: center; font-size: 0.75rem; }
        .office-content .audioclip audio { width: 100%; max-width: 24rem; }
        .office-content a { color: #7c2133; text-decoration: underline; }
        .dark .office-content a { color: #a78bfa; }
        /* Saint/celebration-of-the-day tag, shown inline inside the calendar
           day banner (#bannerDay) instead of the old separate date, psalter
           week and celebration rows. */
        #dayBanner .saint-tag {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0.2rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            vertical-align: middle;
            background: var(--lit-soft, rgba(124, 33, 51, 0.14));
            color: var(--lit-text, #7c2133);
        }
        /* Universalis scripture citations, and the note shown above the
           English text when Kiswahili is chosen. */
        .office-content .citation { font-style: italic; color: #6b7280; margin: 0.4em 0 0.8em; }
        .dark .office-content .citation { color: #9ca3af; }
        .office-content .sw-fallback-note { font-size: 0.85rem; font-style: italic; color: #b91c1c; background: rgba(185,28,28,0.08); border-radius: 0.5rem; padding: 0.6rem 0.9rem; margin: 0 0 1rem; }
        .dark .office-content .sw-fallback-note { color: #f87171; background: rgba(248,113,113,0.12); }
        /* Keep already-italic elements (rubrics, citations, notes) at
           normal weight - only plain body text becomes 90% bold. */
        .office-content .rubric,
        .office-content table.each th[align="right"],
        .office-content td[align="right"],
        .office-content .citation,
        .office-content .sw-fallback-note {
            font-weight: 400;
        }
    </style>
    <!-- Shared light/dark theme: applies the saved choice before paint -->
    <script src="../js/theme.js"></script>
    <script src="../js/text-size.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/logo-loader.js"></script>
    <link rel="stylesheet" href="../css/status-bar-safe-area.css">
    <script src="../js/status-bar.js" defer></script>
</head>
<body class="page-index min-h-screen bg-gradient-vintage dark:bg-gray-900 transition-colors duration-300">
    <div id="app" class="relative z-10 page-content">
        <header id="appBar" class="app-bar" role="banner">
            <div class="header-content">
                <div class="flex items-center gap-2">
                    <a id="backHome" href="../index.html" class="app-bar-btn" aria-label="Back to home" title="Back to home">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </a>
                    <div class="app-bar-brand">
                        <h1 id="hourTitle" class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                            Liturgy of the Hours
                        </h1>
                        <p id="hourSubtitle" class="text-xs text-gray-600 dark:text-gray-400">Prayer of the Church</p>
                    </div>
                </div>
                <button id="darkModeQuickToggle" class="app-bar-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-5 pb-32 pt-6" role="main">
            <!-- Hour switch: Midday / Vespers / Night Prayer, with the language
                 switch (English / Kiswahili) pinned to the right of the same
                 row. Remembered in localStorage; switching re-renders
                 instantly, no page reload. -->
            <div class="flex flex-wrap items-center justify-between gap-y-2 gap-x-2 mb-4">
                <div class="flex-1 hidden sm:block" aria-hidden="true"></div>
                <div id="hourSwitch" class="inline-flex rounded-full bg-white dark:bg-gray-800 shadow p-1" role="tablist" aria-label="Choose the hour">
                    <button id="tabSext" class="px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold transition-colors whitespace-nowrap" role="tab">Midday</button>
                    <button id="tabVespers" class="px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold transition-colors whitespace-nowrap" role="tab">Vespers</button>
                    <button id="tabCompline" class="px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold transition-colors whitespace-nowrap" role="tab">Night Prayer</button>
                </div>
                <div class="inline-flex rounded-full bg-white dark:bg-gray-800 shadow p-1 ml-auto sm:ml-0" role="tablist" aria-label="Choose language / Chagua lugha">
                    <button id="langEn" class="px-2 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors" role="tab">ENG</button>
                    <button id="langSw" class="px-2 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors" role="tab">SW</button>
                </div>
            </div>

            <!-- Date navigation (Universalis free pages cover a sliding window around today) -->
            <div class="rounded-2xl p-4 bg-white dark:bg-gray-800 shadow-lg mb-6">
                <div class="flex items-center justify-between gap-2">
                    <button id="prevDay" class="p-3 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-40" aria-label="Previous day">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div class="flex-1 text-center">
                        <input type="date" id="datePicker" class="w-full max-w-[13rem] mx-auto text-center font-semibold bg-transparent text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" aria-label="Choose a date">
                    </div>
                    <button id="nextDay" class="p-3 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-40" aria-label="Next day">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
                <div class="text-center mt-3">
                    <button id="todayBtn" class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline focus:outline-none hidden">
                        Back to today
                    </button>
                </div>
            </div>

            <!-- Liturgical day banner: just the calendar day, with the saint /
                 celebration of the day (if any) shown as a tag inline with it. -->
            <div id="dayBanner" class="liturgical-card mb-6" data-color="green">
                <div class="text-center">
                    <div id="bannerDay" class="text-lg font-bold text-gray-800 dark:text-gray-100">
                        <span id="bannerDayLabel"></span>
                        <span id="celebrationTag" class="saint-tag hidden"></span>
                    </div>
                </div>
            </div>

            <!-- The office itself. The English text is fetched from Universalis,
                 stripped down to the liturgy by js/universalis-office.js and
                 rendered into this card as native app content - there is no
                 iframe and no Universalis page furniture anywhere in it. -->
            <div class="rounded-2xl bg-white dark:bg-gray-800 shadow-lg overflow-hidden" style="border: 2px solid #7c2133;">
                <div id="hourLoading" class="text-center py-12">
                    <div class="inline-block w-10 h-10 border-4 border-purple-600 border-t-transparent rounded-full animate-spin" aria-hidden="true"></div>
                    <p id="loadingMsg" class="mt-4 text-gray-600 dark:text-gray-400">Loading the office…</p>
                </div>
                <div id="hourUnavailable" class="p-6 text-center hidden">
                    <p id="unavailableMsg" class="text-gray-700 dark:text-gray-300 mb-2">The office for this date is not available yet.</p>
                    <p id="windowNote" class="text-sm text-gray-500 dark:text-gray-400"></p>
                </div>
                <div id="officeContent" class="office-content hidden p-5 sm:p-7"></div>
            </div>

            <p class="text-xs text-gray-500 dark:text-gray-400 text-center mt-4">
                <span id="footerBefore">Texts served by </span><a id="externalLink" class="underline" target="_blank" rel="noopener" href="https://universalis.com">Universalis</a><span id="footerAfter"> — open there for the full-page version.</span>
            </p>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 px-6 py-4 shadow-lg bottom-nav z-40" role="navigation" aria-label="Main Navigation">
            <div class="flex justify-around h-full items-center">
                <!-- Home -->
                <a href="../index.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
                    <span class="text-xs font-medium" data-translate="home">Home</span>
                </a>
                <!-- Prayers -->
                <button id="prayersNavBtn" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200" aria-haspopup="dialog" aria-controls="prayersSheet">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m-5-11h10M9 4h6" />
                </svg>
                    <span class="text-xs font-medium" data-translate="prayers">Prayers</span>
                </button>
                <!-- Calendar -->
                <a href="calendar.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4V1h2v2h6V1h2v2zM3 7v12h18V7H3zm2 2h2v2H5V9zm0 4h2v2H5v-2zm0 4h2v2H5v-2zm4-8h2v2H9V9zm0 4h2v2H9v-2zm0 4h2v2H9v-2zm4-8h2v2h-2V9zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm4-8h2v2h-2V9zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z" />
                </svg>
                    <span class="text-xs font-medium" data-translate="calendar">Calendar</span>
                </a>
                <!-- Settings -->
                <a href="settings.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.82,11.69,4.82,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
                </svg>
                    <span class="text-xs font-medium" data-translate="settings">Settings</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Shared liturgical calendar engine (day label, psalter week, celebrations) -->
    <script src="../js/liturgical-calendar.js"></script>
    <!-- Extracts and sanitises the liturgy out of a fetched Universalis hour
         page so only the prayer itself is rendered inside the app -->
    <script src="../js/universalis-office.js"></script>

    <script>
        (function () {
            var btn = document.getElementById('darkModeQuickToggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                window.IPrayTheme.toggle();
            });
        })();
    </script>

    <script>
        (function () {
            // Universalis' free pages cover a sliding window around today
            // (a few days back, just over a week ahead); outside it they
            // redirect, so navigation is clamped to this window.
            var WINDOW_BACK_DAYS = 3;
            var WINDOW_AHEAD_DAYS = 9;

            // Universalis sends no CORS headers, so the page is fetched through
            // the app's Cloudflare Worker or, failing that, a public CORS proxy
            // (UniversalisOffice.PROXIES, tried in turn); js/universalis-office.js
            // then extracts the liturgy and it is rendered natively in the app
            // layout. If every route fails the card says so - the whole page
            // is never embedded.
            var PROXIES = UniversalisOffice.PROXIES;
            var FETCH_TIMEOUT_MS = 12000;
            // Versioned so offices cached by an earlier build (which stored
            // far more of the Universalis page) are re-fetched, not replayed.
            var CACHE_PREFIX = 'officeHtml-v' + UniversalisOffice.VERSION + '-';

            var HOURS = {
                sext: {
                    page: 'sext',
                    title: 'Midday Prayer',
                    titleSw: 'Sala ya Mchana',
                    subtitle: 'Sext · Prayer During the Day',
                    subtitleSw: 'Saa Sita · Sala ya Wakati wa Mchana'
                },
                vespers: {
                    page: 'vespers',
                    title: 'Vespers',
                    titleSw: 'Masifu ya Jioni',
                    subtitle: 'Evening Prayer of the Church',
                    subtitleSw: 'Sala ya Jioni ya Kanisa'
                }
            };
            // The page's own wording (everything but the office text), so
            // that with Kiswahili chosen the whole page reads in Kiswahili.
            var UI = {
                en: {
                    tabs: { sext: 'Midday', vespers: 'Vespers', compline: 'Night Prayer' },
                    hourSwitch: 'Choose the hour',
                    loading: 'Loading the office…',
                    today: 'Back to today',
                    prevDay: 'Previous day',
                    nextDay: 'Next day',
                    datePicker: 'Choose a date',
                    backHome: 'Back to home',
                    footerBefore: 'Texts served by ',
                    footerAfter: ' — open there for the full-page version.',
                    nav: { home: 'Home', prayers: 'Prayers', calendar: 'Calendar', settings: 'Settings' }
                },
                sw: {
                    tabs: { sext: 'Mchana', vespers: 'Jioni', compline: 'Usiku' },
                    hourSwitch: 'Chagua sala',
                    loading: 'Inapakia sala…',
                    today: 'Rudi leo',
                    prevDay: 'Siku iliyopita',
                    nextDay: 'Siku inayofuata',
                    datePicker: 'Chagua tarehe',
                    backHome: 'Rudi nyumbani',
                    footerBefore: 'Maandishi yanatoka ',
                    footerAfter: ' — fungua huko kuona ukurasa mzima.',
                    nav: { home: 'Nyumbani', prayers: 'Sala', calendar: 'Kalenda', settings: 'Mipangilio' }
                }
            };
            var COLOR_MAP = { white: 'white', red: 'red', green: 'green', purple: 'purple', rose: 'purple', gold: 'gold' };
            var ROMAN = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' };

            var params = new URLSearchParams(window.location.search);
            var hourKey = HOURS[params.get('hour')] ? params.get('hour') : 'sext';

            var titleEl = document.getElementById('hourTitle');
            var subtitleEl = document.getElementById('hourSubtitle');
            var TABS = {
                sext: document.getElementById('tabSext'),
                vespers: document.getElementById('tabVespers'),
                compline: document.getElementById('tabCompline')
            };
            var datePicker = document.getElementById('datePicker');
            var prevBtn = document.getElementById('prevDay');
            var nextBtn = document.getElementById('nextDay');
            var todayBtn = document.getElementById('todayBtn');
            var banner = document.getElementById('dayBanner');
            var bannerDayLabel = document.getElementById('bannerDayLabel');
            var celebrationTag = document.getElementById('celebrationTag');
            var loadingEl = document.getElementById('hourLoading');
            var unavailableEl = document.getElementById('hourUnavailable');
            var windowNote = document.getElementById('windowNote');
            var unavailableMsgEl = document.getElementById('unavailableMsg');
            var officeEl = document.getElementById('officeContent');
            var externalLink = document.getElementById('externalLink');
            var loadToken = 0;

            // The app's language (js/i18n.js); the office itself exists in
            // Kiswahili and English only.
            var lang = IPrayI18n.prayerLang();
            var langEnBtn = document.getElementById('langEn');
            var langSwBtn = document.getElementById('langSw');

            var today = startOfDay(new Date());
            var minDate = addDays(today, -WINDOW_BACK_DAYS);
            var maxDate = addDays(today, WINDOW_AHEAD_DAYS);
            var currentDate = today;
            var currentStamp = stampOf(today);

            function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
            function addDays(d, n) { var c = new Date(d); c.setDate(c.getDate() + n); return c; }
            function stampOf(d) {
                return '' + d.getFullYear()
                    + String(d.getMonth() + 1).padStart(2, '0')
                    + String(d.getDate()).padStart(2, '0');
            }
            function isoOf(d) { var s = stampOf(d); return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6); }
            function fmt(d) {
                return d.toLocaleDateString(lang === 'sw' ? 'sw' : 'en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }

            function setLabel(id, label) {
                var el = document.getElementById(id);
                if (!el) return;
                el.setAttribute('aria-label', label);
                if (el.hasAttribute('title')) el.setAttribute('title', label);
            }

            function applyHourChrome() {
                var h = HOURS[hourKey];
                var ui = UI[lang];
                var sw = lang === 'sw';
                document.documentElement.lang = lang;
                titleEl.textContent = sw ? h.titleSw : h.title;
                subtitleEl.textContent = sw ? h.subtitleSw : h.subtitle;
                document.title = (sw ? h.titleSw : h.title) + ' - ipray';
                Object.keys(TABS).forEach(function (key) {
                    var active = key === hourKey;
                    TABS[key].textContent = ui.tabs[key];
                    TABS[key].className = 'px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold transition-colors whitespace-nowrap ' + (active
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'
                        : 'text-gray-600 dark:text-gray-300');
                    TABS[key].setAttribute('aria-selected', String(active));
                });
                document.getElementById('loadingMsg').textContent = ui.loading;
                todayBtn.textContent = ui.today;
                document.getElementById('footerBefore').textContent = ui.footerBefore;
                document.getElementById('footerAfter').textContent = ui.footerAfter;
                setLabel('hourSwitch', ui.hourSwitch);
                setLabel('prevDay', ui.prevDay);
                setLabel('nextDay', ui.nextDay);
                setLabel('datePicker', ui.datePicker);
                setLabel('backHome', ui.backHome);
                document.querySelectorAll('.bottom-nav [data-translate]').forEach(function (el) {
                    var label = ui.nav[el.getAttribute('data-translate')];
                    if (label) el.textContent = label;
                });
                updateTextCtlVisibility();
            }

            // js/text-size-control.js (loaded deferred, so it may not have
            // created its floating button yet on the very first call) resizes
            // .office-content text, which every rendered office - English or
            // Swahili, Readings, Midday or Vespers - shares. It's only hidden
            // when the rendered office itself isn't on screen (the loading
            // spinner or the "not available" message), since in those cases
            // there's no office text on the page to resize.
            function updateTextCtlVisibility() {
                var ctl = document.querySelector('.prayer-textctl');
                if (!ctl) return;
                // An inline style is used (rather than a "hidden" class) because
                // text-size-control.js injects its own <style> with
                // ".prayer-textctl{display:flex}" after Tailwind's stylesheet,
                // which would otherwise win a same-specificity, later-in-source
                // tie against a Tailwind "hidden" utility class.
                ctl.style.display = !officeEl.classList.contains('hidden') ? '' : 'none';
            }

            function applyLangSwitchUI() {
                [[langEnBtn, 'en'], [langSwBtn, 'sw']].forEach(function (pair) {
                    var active = lang === pair[1];
                    pair[0].className = 'px-2 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors ' + (active
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'
                        : 'text-gray-600 dark:text-gray-300');
                    pair[0].setAttribute('aria-selected', String(active));
                });
            }

            function setLang(newLang) {
                if (newLang === lang) return;
                // Saved and passed to every open page by js/i18n.js, which
                // calls showLang below.
                IPrayI18n.set(newLang);
            }

            function showLang(newLang) {
                if (newLang === lang) return;
                lang = newLang;
                applyLangSwitchUI();
                applyHourChrome();
                load(currentDate);
            }

            // At Vespers on the eve of a Sunday or a solemnity the office is
            // First Vespers of the next day (Universalis serves it on that
            // evening's page too), so the banner shows the next day.
            function renderBanner(date) {
                var vespers = hourKey === 'vespers' ? getVespersDay(date, lang) : null;
                var day = vespers ? vespers.date : date;
                var info = getLiturgicalToday(day, lang);
                var celebration = getCelebrationForDate(day, lang);
                bannerDayLabel.textContent = (vespers && vespers.first
                    ? (lang === 'sw' ? 'Masifu ya Jioni I · ' : 'First Vespers · ')
                    : '') + info.dayLabel;
                banner.setAttribute('data-color', COLOR_MAP[(celebration && celebration.color) || info.color] || 'green');
                if (celebration) {
                    celebrationTag.textContent = celebration.rankLabel + ': ' + celebration.name;
                    celebrationTag.classList.remove('hidden');
                } else {
                    celebrationTag.classList.add('hidden');
                }
            }

            // Heading shown above the liturgy, e.g. "Vespers - English", so
            // the reader can see which hour they are looking at and which
            // source the text came from. sourceLang is the language of the
            // text itself ('en' for Universalis, 'sw' for the local books),
            // which is not always the language the interface is in.
            function officeHeading(sourceLang) {
                var name = lang === 'sw' ? HOURS[hourKey].titleSw : HOURS[hourKey].title;
                var source = sourceLang === 'sw'
                    ? (lang === 'sw' ? 'Kiswahili' : 'Swahili')
                    : (lang === 'sw' ? 'Kiingereza' : 'English');
                return '<h3 class="office-hour-heading">' + esc(name) + ' \u2014 ' + esc(source) + '</h3>';
            }

            function showOffice(htmlStr, sourceLang) {
                officeEl.innerHTML = officeHeading(sourceLang) + htmlStr;
                loadingEl.classList.add('hidden');
                unavailableEl.classList.add('hidden');
                officeEl.classList.remove('hidden');
                updateTextCtlVisibility();
            }

            // Shown instead of the office when it genuinely cannot be
            // rendered. Previously this fell back to an iframe of the whole
            // Universalis page; the app now says so plainly and offers the
            // external link in the caption below the card instead.
            function showUnavailable(message, note) {
                officeEl.classList.add('hidden');
                loadingEl.classList.add('hidden');
                unavailableMsgEl.textContent = message;
                windowNote.textContent = note || '';
                unavailableEl.classList.remove('hidden');
                updateTextCtlVisibility();
            }

            // onFail is told *why* it failed. "Every proxy was unreachable"
            // and "a proxy returned the page but no office could be read out
            // of it" are completely different problems, and reporting both as
            // a network error made an extraction bug look like a connection
            // one. The step log from the last readable response is kept so
            // it can be printed to the console.
            function fetchThroughProxies(url, token, onOk, onFail) {
                var i = 0;
                var gotBody = false;
                var lastLog = null;

                (function tryNext() {
                    if (token !== loadToken) return;
                    if (i >= PROXIES.length) { onFail(gotBody, lastLog); return; }
                    var proxied = PROXIES[i++](url);
                    var ctrl = window.AbortController ? new AbortController() : null;
                    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, FETCH_TIMEOUT_MS);
                    fetch(proxied, ctrl ? { signal: ctrl.signal } : {})
                        .then(function (r) {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.text();
                        })
                        .then(function (text) {
                            clearTimeout(timer);
                            if (token !== loadToken) return;
                            if (text && text.length > 500) gotBody = true;
                            var log = [];
                            var cleaned = UniversalisOffice.extract(text, hourKey, log);
                            if (!cleaned) { lastLog = log; throw new Error('no office content'); }
                            onOk(cleaned);
                        })
                        .catch(function () {
                            clearTimeout(timer);
                            tryNext();
                        });
                })();
            }

            // Drop cached offices for dates that have slid out of the window,
            // and every office cached by an earlier extractor version: those
            // are never read again, and each holds a whole hour's text.
            function pruneCache() {
                var oldest = stampOf(minDate);
                for (var i = localStorage.length - 1; i >= 0; i--) {
                    var k = localStorage.key(i);
                    if (!k || k.indexOf('officeHtml-v') !== 0) continue;
                    if (k.indexOf(CACHE_PREFIX) !== 0 || k.slice(k.lastIndexOf('-') + 1) < oldest) {
                        localStorage.removeItem(k);
                    }
                }
            }

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }

            // Midday Prayer and Vespers have no verified Swahili source yet
            // (unlike the Office of Readings, which was extracted from the
            // official Mwaka Sehemu PDFs) - show English with an explanatory
            // note rather than fabricated or incorrect Swahili text.
            function swHourUnavailableNote() {
                return '<div class="sw-fallback-note">Kiswahili cha ' + HOURS[hourKey].titleSw + ' bado hakipatikani. Inaonyesha maandishi ya Kiingereza kwa sasa.</div>';
            }

            // Universalis fetch (English content), used directly for the
            // English UI and, with noteHtml explaining why, for Kiswahili.
            function loadUniversalisContent(token, noteHtml) {
                var stamp = stampOf(currentDate);
                var url = 'https://universalis.com/' + stamp + '/' + HOURS[hourKey].page + '.htm';
                var cacheKey = CACHE_PREFIX + hourKey + '-' + stamp;
                var cached = null;
                try { cached = localStorage.getItem(cacheKey); } catch (e) {}
                if (cached && UniversalisOffice.looksLikeFullPage(cached)) {
                    try { localStorage.removeItem(cacheKey); } catch (e) {}
                    cached = null;
                }
                if (cached) {
                    if (token !== loadToken || stamp !== currentStamp) return;
                    showOffice((noteHtml || '') + UniversalisOffice.postProcessHtml(cached, hourKey), 'en');
                    return;
                }

                fetchThroughProxies(url, token, function (cleaned) {
                    if (token !== loadToken || stamp !== currentStamp) return;
                    try {
                        pruneCache();
                        localStorage.setItem(cacheKey, cleaned);
                    } catch (e) {}
                    showOffice((noteHtml || '') + cleaned, 'en');
                }, function (gotBody, log) {
                    if (token !== loadToken || stamp !== currentStamp) return;
                    if (log && window.console && console.warn) {
                        console.warn('[iPray] ' + hourKey + ' ' + stamp +
                            ': page fetched but no office could be extracted.\n  ' +
                            log.join('\n  ') + '\n  source: ' + url);
                    }
                    if (gotBody) {
                        showUnavailable(
                            lang === 'sw'
                                ? 'Ukurasa umepakuliwa lakini maandishi ya sala hayakupatikana ndani yake.'
                                : 'The page loaded, but no prayer text could be read from it.',
                            lang === 'sw'
                                ? 'Universalis huenda imebadilisha muundo wa ukurasa huu. Fungua Universalis kwa kiungo kilicho hapa chini.'
                                : 'Universalis may have changed the layout of this page. Details are in the browser console; the link below opens it there.');
                    } else {
                        showUnavailable(
                            lang === 'sw'
                                ? 'Maandishi ya sala hayakuweza kupakuliwa kwa sasa.'
                                : 'The text of this hour could not be loaded right now.',
                            lang === 'sw'
                                ? 'Jaribu tena, au fungua Universalis kwa kiungo kilicho hapa chini.'
                                : 'Try again, or open Universalis using the link below.');
                    }
                });
            }

            function load(date) {
                currentDate = startOfDay(date);
                currentStamp = stampOf(currentDate);
                datePicker.value = isoOf(currentDate);
                prevBtn.disabled = +currentDate <= +minDate;
                nextBtn.disabled = +currentDate >= +maxDate;
                todayBtn.classList.toggle('hidden', +currentDate === +today);
                renderBanner(currentDate);

                var url = 'https://universalis.com/' + stampOf(currentDate) + '/' + HOURS[hourKey].page + '.htm';
                externalLink.href = url;
                var token = ++loadToken;

                if (+currentDate < +minDate || +currentDate > +maxDate) {
                    showUnavailable(
                        lang === 'sw'
                            ? 'Sala ya tarehe hii haipatikani bado.'
                            : 'The office for this date is not available yet.',
                        (lang === 'sw' ? 'Sala zinapatikana kuanzia ' : 'The office is available from ')
                            + fmt(minDate) + (lang === 'sw' ? ' hadi ' : ' to ') + fmt(maxDate) + '.');
                    return;
                }

                unavailableEl.classList.add('hidden');
                officeEl.classList.add('hidden');
                loadingEl.classList.remove('hidden');

                if (lang === 'sw') {
                    loadUniversalisContent(token, swHourUnavailableNote());
                    return;
                }

                loadUniversalisContent(token, '');
            }


            function switchHour(key) {
                if (key === hourKey) return;
                if (key === 'compline') {
                    window.location.href = 'compline.html';
                    return;
                }
                hourKey = key;
                var qs = new URLSearchParams(window.location.search);
                qs.set('hour', key);
                history.replaceState(null, '', window.location.pathname + '?' + qs);
                applyHourChrome();
                load(currentDate);
            }

            Object.keys(TABS).forEach(function (key) {
                TABS[key].addEventListener('click', function () { switchHour(key); });
            });
            langEnBtn.addEventListener('click', function () { setLang('en'); });
            langSwBtn.addEventListener('click', function () { setLang('sw'); });
            // Stay in sync if the language is changed from another open tab/page
            // (e.g. Settings), matching the rest of the app's convention.
            IPrayI18n.onChange(function () { showLang(IPrayI18n.prayerLang()); });
            prevBtn.addEventListener('click', function () { load(addDays(currentDate, -1)); });
            nextBtn.addEventListener('click', function () { load(addDays(currentDate, 1)); });
            todayBtn.addEventListener('click', function () { load(today); });
            datePicker.min = isoOf(minDate);
            datePicker.max = isoOf(maxDate);
            datePicker.addEventListener('change', function () {
                if (!datePicker.value) return;
                var p = datePicker.value.split('-');
                load(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
            });

            applyHourChrome();
            applyLangSwitchUI();
            load(today);

            // js/text-size-control.js is deferred, so its floating button
            // may not exist yet at the point applyHourChrome() first runs
            // above; DOMContentLoaded always fires after all deferred
            // scripts, so this catches the initial visibility correctly.
            document.addEventListener('DOMContentLoaded', updateTextCtlVisibility);
        })();
    </script>
    <script src="../js/prayers-nav.js" defer></script>
    <!-- A-/A+ control that resizes the rendered office text (.office-content)
         for every hour and language - Readings, Midday and Vespers, English
         and Swahili alike; hidden only while the office itself isn't on
         screen (loading or unavailable) by updateTextCtlVisibility(). -->
    <script src="../js/text-size-control.js" defer></script>
    <script src="../js/prevent-zoom.js" defer></script>
</body>
</html>
