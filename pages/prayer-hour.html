<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Liturgy of the Hours - ipray</title>
    <link rel="icon" href="../assets/images/favicon.ico.jpg" type="image/x-icon">
    <meta name="description" content="Midday Prayer and Vespers (Evening Prayer) for every day, complete with saint memorials, feasts and solemnities">
    <meta name="theme-color" content="#f7faf9">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7faf9">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12191e">
    <!-- Tailwind CSS: locally built (npm run build) -->
    <link rel="stylesheet" href="../dist/output.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/index.css">
    <style>
        /* Universalis office markup (.v verse lines, .vi continuations, table.each
           section headings, rubrics…) restyled to flow with the app layout. */
        .office-content { font-size: 1.0625rem; line-height: 1.75; color: #374151; }
        .dark .office-content { color: #d1d5db; }
        .office-content .v { margin: 0; }
        .office-content .v.gb { margin-top: 0.9em; }
        .office-content .vi { padding-left: 1.25rem; }
        .office-content .p, .office-content .pi { margin: 0.6em 0; }
        .office-content table { width: 100%; border-collapse: collapse; }
        .office-content table.each { margin: 2rem 0 0.75rem; }
        .office-content table.each th { font-weight: 400; }
        .office-content table.each th[align="left"] {
            display: inline-block; font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: #7c3aed; background: rgba(124, 58, 237, 0.10);
            border-radius: 9999px; padding: 0.3rem 0.85rem;
        }
        .dark .office-content table.each th[align="left"] { color: #c4b5fd; background: rgba(124, 58, 237, 0.28); }
        .office-content table.each th[align="right"] { font-size: 0.85rem; font-style: italic; color: #6b7280; text-align: right; }
        .dark .office-content table.each th[align="right"] { color: #9ca3af; }
        .office-content th:empty, .office-content td:empty { display: none; }
        .office-content td[align="right"] { font-size: 0.85rem; font-style: italic; color: #6b7280; text-align: right; padding-top: 0.35rem; }
        .dark .office-content td[align="right"] { color: #9ca3af; }
        .office-content h4 { margin: 1.25rem 0 0.75rem; font-size: 1rem; font-weight: 700; color: #1f2937; }
        .dark .office-content h4 { color: #f3f4f6; }
        .office-content hr.shortrule { border: 0; border-top: 1px dashed #d1d5db; width: 4rem; margin: 1.75rem auto 0; }
        .office-content > hr.shortrule:first-child { display: none; }
        .dark .office-content hr.shortrule { border-top-color: #4b5563; }
        .office-content .rubric { font-size: 0.875rem; font-style: italic; color: #b91c1c; margin: 0.75rem 0; }
        .dark .office-content .rubric { color: #f87171; }
        .office-content .boldrubric { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; color: #b91c1c; }
        .dark .office-content .boldrubric { color: #f87171; }
        .office-content .audioclip { margin: 1.25rem 0; text-align: center; font-size: 0.75rem; }
        .office-content .audioclip audio { width: 100%; max-width: 24rem; }
        .office-content a { color: #7c3aed; text-decoration: underline; }
        .dark .office-content a { color: #a78bfa; }
    </style>
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('darkMode') === 'true') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="page-index min-h-screen bg-gradient-vintage dark:bg-gray-900 transition-colors duration-300">
    <div id="app" class="relative z-10 page-content">
        <header id="appBar" class="app-bar" role="banner">
            <div class="header-content">
                <div class="flex items-center gap-2">
                    <a href="../index.html" class="app-bar-btn" aria-label="Back to home" title="Back to home">

        <main class="max-w-2xl mx-auto px-5 pb-32 pt-6" role="main">

                    <div class="flex-1 text-center">
                        <input type="date" id="datePicker" class="w-full max-w-[13rem] mx-auto text-center font-semibold bg-transparent text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" aria-label="Choose a date">

            <!-- Liturgical day banner: day, psalter week, celebration of the day -->

    <script>
        (function () {
            var btn = document.getElementById('darkModeQuickToggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('darkMode', isDark);
            });
        })();
    </script>

    <script>
        (function () {
            // Universalis' free pages cover a sliding window around today
            // (a few days back, just over a week ahead); outside it they
            // redirect, so navigation is clamped to this window.
            var WINDOW_BACK_DAYS = 3;
            var WINDOW_AHEAD_DAYS = 9;

            // Universalis sends no CORS headers, so the page is fetched through
            // a public CORS proxy (trying each in turn) and the office content
            // is extracted and rendered natively in the app layout. If every
            // proxy fails, the iframe below is used as a fallback.
            var PROXIES = [
                function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
                function (u) { return 'https://api.cors.lol/?url=' + encodeURIComponent(u); },
                function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); }
            ];
            var FETCH_TIMEOUT_MS = 12000;
            var CACHE_PREFIX = 'officeHtml-';

            var HOURS = {
                sext: {
                    page: 'sext',
                    title: 'Midday Prayer',
                    titleSw: 'Sala ya Mchana',
                    subtitle: 'Sext · Prayer During the Day'
                },
                vespers: {
                    page: 'vespers',
                    title: 'Vespers',
                    titleSw: 'Masifu ya Jioni',
                    subtitle: 'Evening Prayer of the Church'
                }
            };
            var RANK_LABELS = {
                en: { 'Triduum': 'Sacred Triduum', 'Solemnity': 'Solemnity', 'Feast': 'Feast', 'Special': 'Liturgical Day', 'Memorial': 'Memorial', 'Optional Memorial': 'Optional Memorial' },
                sw: { 'Triduum': 'Siku Kuu Tatu Takatifu', 'Solemnity': 'Sherehe', 'Feast': 'Sikukuu', 'Special': 'Siku Maalum', 'Memorial': 'Kumbukumbu', 'Optional Memorial': 'Kumbukumbu ya Hiari' }
            };
            var COLOR_MAP = { white: 'white', red: 'red', green: 'green', purple: 'purple', rose: 'purple', gold: 'gold' };
            var ROMAN = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' };

            var params = new URLSearchParams(window.location.search);
            var hourKey = params.get('hour') === 'vespers' ? 'vespers' : 'sext';

            var titleEl = document.getElementById('hourTitle');
            var subtitleEl = document.getElementById('hourSubtitle');
            var tabSext = document.getElementById('tabSext');
            var tabVespers = document.getElementById('tabVespers');
            var datePicker = document.getElementById('datePicker');
            var prevBtn = document.getElementById('prevDay');
            var nextBtn = document.getElementById('nextDay');
            var todayBtn = document.getElementById('todayBtn');
            var banner = document.getElementById('dayBanner');
            var bannerDate = document.getElementById('bannerDate');
            var bannerDay = document.getElementById('bannerDay');
            var bannerPsalter = document.getElementById('bannerPsalter');
            var celebrationBox = document.getElementById('bannerCelebration');
            var celebrationRank = document.getElementById('celebrationRank');
            var celebrationName = document.getElementById('celebrationName');
            var celebrationNote = document.getElementById('celebrationNote');
            var loadingEl = document.getElementById('hourLoading');
            var unavailableEl = document.getElementById('hourUnavailable');
            var windowNote = document.getElementById('windowNote');
            var frame = document.getElementById('hourFrame');
            var officeEl = document.getElementById('officeContent');
            var externalLink = document.getElementById('externalLink');
            var loadToken = 0;
            var fallbackToken = -1;

            var lang = 'en';
            try {
                if (localStorage.getItem('preferredLanguage') === 'sw') lang = 'sw';
            } catch (e) {}

            var today = startOfDay(new Date());
            var minDate = addDays(today, -WINDOW_BACK_DAYS);
            var maxDate = addDays(today, WINDOW_AHEAD_DAYS);
            var currentDate = today;

            function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
            function addDays(d, n) { var c = new Date(d); c.setDate(c.getDate() + n); return c; }
            function stampOf(d) {
                return '' + d.getFullYear()
                    + String(d.getMonth() + 1).padStart(2, '0')
                    + String(d.getDate()).padStart(2, '0');
            }
            function isoOf(d) { var s = stampOf(d); return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6); }
            function fmt(d) {
                return d.toLocaleDateString(lang === 'sw' ? 'sw' : 'en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }

            function applyHourChrome() {
                var h = HOURS[hourKey];
                titleEl.textContent = lang === 'sw' ? h.titleSw : h.title;
                subtitleEl.textContent = h.subtitle;
                document.title = h.title + ' - ipray';
                [tabSext, tabVespers].forEach(function (tab, i) {
                    var active = (i === 0) === (hourKey === 'sext');
                    tab.className = 'px-5 py-2 rounded-full text-sm font-semibold transition-colors ' + (active
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'
                        : 'text-gray-600 dark:text-gray-300');
                    tab.setAttribute('aria-selected', String(active));
                });
            }

            function renderBanner(date) {
                var info = getLiturgicalToday(date, lang);
                var celebration = getCelebrationForDate(date);
                bannerDate.textContent = fmt(date);
                bannerDay.textContent = info.dayLabel;
                banner.setAttribute('data-color', COLOR_MAP[(celebration && celebration.color) || info.color] || 'green');
                if (info.psalterWeek) {
                    bannerPsalter.textContent = (lang === 'sw' ? 'Juma la Zaburi ' : 'Psalter Week ') + (ROMAN[info.psalterWeek] || info.psalterWeek);
                    bannerPsalter.classList.remove('hidden');
                } else {
                    bannerPsalter.classList.add('hidden');
                }
                if (celebration) {
                    celebrationRank.textContent = RANK_LABELS[lang][celebration.type] || celebration.type;
                    celebrationName.textContent = celebration.name;
                    var isMajor = celebration.type === 'Solemnity' || celebration.type === 'Feast' || celebration.type === 'Triduum';
                    celebrationNote.classList.toggle('hidden', !isMajor);
                    celebrationBox.classList.remove('hidden');
                } else {
                    celebrationBox.classList.add('hidden');
                }
            }

            // Pull the office out of the fetched Universalis page and strip
            // everything that should not run or render inside the app.
            function cleanOffice(html) {
                var doc = new DOMParser().parseFromString(html, 'text/html');
                var inner = doc.getElementById('innertexst') || doc.getElementById('texts');
                if (!inner || !inner.querySelector('.v, .p')) return null;
                inner.querySelectorAll('script, style, link, iframe, object, embed, form, #univPageName, #appplug, .toprightbox').forEach(function (n) {
                    n.parentNode.removeChild(n);
                });
                inner.querySelectorAll('*').forEach(function (n) {
                    for (var i = n.attributes.length - 1; i >= 0; i--) {
                        if (/^on/i.test(n.attributes[i].name)) n.removeAttribute(n.attributes[i].name);
                    }
                });
                inner.querySelectorAll('a[href]').forEach(function (a) {
                    var href = a.getAttribute('href');
                    if (href && href.charAt(0) === '/') a.setAttribute('href', 'https://universalis.com' + href);
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener');
                });
                return inner.innerHTML;
            }

            function showOffice(htmlStr) {
                officeEl.innerHTML = htmlStr;
                loadingEl.classList.add('hidden');
                frame.classList.add('hidden');
                officeEl.classList.remove('hidden');
            }

            function fetchThroughProxies(url, token, onOk, onFail) {
                var i = 0;
                (function tryNext() {
                    if (token !== loadToken) return;
                    if (i >= PROXIES.length) { onFail(); return; }
                    var proxied = PROXIES[i++](url);
                    var ctrl = window.AbortController ? new AbortController() : null;
                    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, FETCH_TIMEOUT_MS);
                    fetch(proxied, ctrl ? { signal: ctrl.signal } : {})
                        .then(function (r) {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.text();
                        })
                        .then(function (text) {
                            clearTimeout(timer);
                            if (token !== loadToken) return;
                            var cleaned = cleanOffice(text);
                            if (!cleaned) throw new Error('no office content');
                            onOk(cleaned);
                        })
                        .catch(function () {
                            clearTimeout(timer);
                            tryNext();
                        });
                })();
            }

            // Drop cached offices for dates that have slid out of the window.
            function pruneCache() {
                var oldest = stampOf(minDate);
                for (var i = localStorage.length - 1; i >= 0; i--) {
                    var k = localStorage.key(i);
                    if (k && k.indexOf(CACHE_PREFIX) === 0 && k.slice(k.lastIndexOf('-') + 1) < oldest) {
                        localStorage.removeItem(k);
                    }
                }
            }

            function load(date) {
                currentDate = startOfDay(date);
                datePicker.value = isoOf(currentDate);
                prevBtn.disabled = +currentDate <= +minDate;
                nextBtn.disabled = +currentDate >= +maxDate;
                todayBtn.classList.toggle('hidden', +currentDate === +today);
                renderBanner(currentDate);

                var url = 'https://universalis.com/' + stampOf(currentDate) + '/' + HOURS[hourKey].page + '.htm';
                externalLink.href = url;
                var token = ++loadToken;

                if (+currentDate < +minDate || +currentDate > +maxDate) {
                    frame.classList.add('hidden');
                    officeEl.classList.add('hidden');
                    loadingEl.classList.add('hidden');
                    windowNote.textContent = (lang === 'sw' ? 'Sala zinapatikana kuanzia ' : 'The office is available from ')
                        + fmt(minDate) + (lang === 'sw' ? ' hadi ' : ' to ') + fmt(maxDate) + '.';
                    unavailableEl.classList.remove('hidden');
                    return;
                }

                unavailableEl.classList.add('hidden');
                frame.classList.add('hidden');
                officeEl.classList.add('hidden');
                loadingEl.classList.remove('hidden');

                var cacheKey = CACHE_PREFIX + hourKey + '-' + stampOf(currentDate);
                var cached = null;
                try { cached = localStorage.getItem(cacheKey); } catch (e) {}
                if (cached) {
                    showOffice(cached);
                    return;
                }

                fetchThroughProxies(url, token, function (cleaned) {
                    try {
                        pruneCache();
                        localStorage.setItem(cacheKey, cleaned);
                    } catch (e) {}
                    showOffice(cleaned);
                }, function () {
                    if (token !== loadToken) return;
                    fallbackToken = token;
                    frame.src = url;
                });
            }

            frame.addEventListener('load', function () {
                if (!frame.src || fallbackToken !== loadToken) return;
                loadingEl.classList.add('hidden');
                frame.classList.remove('hidden');
            });

            function switchHour(key) {
                if (key === hourKey) return;
                hourKey = key;
                var qs = new URLSearchParams(window.location.search);
                qs.set('hour', key);
                history.replaceState(null, '', window.location.pathname + '?' + qs);
                applyHourChrome();
                load(currentDate);
            }

            tabSext.addEventListener('click', function () { switchHour('sext'); });
            tabVespers.addEventListener('click', function () { switchHour('vespers'); });
            prevBtn.addEventListener('click', function () { load(addDays(currentDate, -1)); });
            nextBtn.addEventListener('click', function () { load(addDays(currentDate, 1)); });
            todayBtn.addEventListener('click', function () { load(today); });
            datePicker.min = isoOf(minDate);
            datePicker.max = isoOf(maxDate);
            datePicker.addEventListener('change', function () {
                if (!datePicker.value) return;
                var p = datePicker.value.split('-');
                load(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
            });

            applyHourChrome();
            load(today);
        })();
    </script>
</body>
</html>
