<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daily Readings - ipray</title>
    <link rel="icon" href="../assets/images/favicon.ico.jpg" type="image/x-icon">
    <meta name="description" content="Daily Catholic Mass readings for every day of the year, in the proper order of the Mass">
    <meta name="theme-color" content="#f7faf9">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7faf9">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12191e">
    <!-- Tailwind CSS: locally built (npm run build) -->
    <link rel="stylesheet" href="../dist/output.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/index.css">
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('darkMode') === 'true') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* Universalis reading text arrives as HTML with its own indentation styles */
        .reading-text { line-height: 1.75; }
        .reading-text div { margin-bottom: 0.15rem; }
    </style>
    <script src="../js/logo-loader.js"></script>
</head>
<body class="page-index min-h-screen bg-gradient-vintage dark:bg-gray-900 transition-colors duration-300">
    <div id="app" class="relative z-10 page-content">
        <header id="appBar" class="app-bar" role="banner">
            <div class="header-content">
                <div class="flex items-center gap-2">
                    <a href="../index.html" class="app-bar-btn" aria-label="Back to home" title="Back to home">

                        </svg>
                    </a>
                    <div class="app-bar-brand">
                        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                            Daily Readings
                        </h1>
                        <p class="text-xs text-gray-600 dark:text-gray-400">Mass readings for every day</p>
                    </div>
                </div>
                <button id="darkModeQuickToggle" class="app-bar-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-5 pb-32 pt-6" role="main">
            <!-- Date navigation: pick any day of any year -->
            <div class="rounded-2xl p-4 bg-white dark:bg-gray-800 shadow-lg mb-6">
                <div class="flex items-center justify-between gap-2">
                    <button id="prevDay" class="p-3 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" aria-label="Previous day">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div class="flex-1 text-center">
                        <input type="date" id="datePicker" class="w-full max-w-[13rem] mx-auto text-center font-semibold bg-transparent text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" aria-label="Choose a date">
                    </div>
                    <button id="nextDay" class="p-3 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" aria-label="Next day">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
                <div class="text-center mt-3">
                    <button id="todayBtn" class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline focus:outline-none hidden">
                        Back to today
                    </button>
                </div>
            </div>

            <!-- Liturgical day banner -->
            <div id="dayBanner" class="liturgical-card mb-6 hidden" data-color="green">
                <div class="text-center">
                    <p id="readingsDate" class="text-sm text-gray-600 dark:text-gray-400 mb-1"></p>
                    <div id="liturgicalDayTitle" class="text-lg font-bold text-gray-800 dark:text-gray-100"></div>
                </div>
            </div>

            <!-- Loading state -->
            <div id="readingsLoading" class="text-center py-12">
                <div class="inline-block w-10 h-10 border-4 border-purple-600 border-t-transparent rounded-full animate-spin" aria-hidden="true"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Loading readings…</p>
            </div>

            <!-- Error state -->
            <div id="readingsError" class="rounded-2xl p-6 bg-white dark:bg-gray-800 shadow-lg text-center hidden">
                <p id="readingsErrorText" class="text-gray-700 dark:text-gray-300 mb-4">Unable to load the readings for this day. Please check your connection and try again.</p>
                <button id="retryBtn" class="px-6 py-2 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold">Retry</button>
            </div>

            <!-- Readings rendered here in the order of the Mass -->
            <div id="readingsContainer" class="space-y-6"></div>

            <p id="readingsCopyright" class="text-xs text-gray-500 dark:text-gray-400 text-center mt-8 hidden"></p>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 px-6 py-4 shadow-lg bottom-nav z-40" role="navigation" aria-label="Main Navigation">
            <div class="flex justify-around h-full items-center">
                <!-- Home -->
                <a href="../index.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-purple-600 dark:text-purple-400">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
                    <span class="text-xs font-medium" data-translate="home">Home</span>
                </a>
                <!-- Prayers -->
                <a href="../pages/prayer.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m-5-11h10M9 4h6" />
                </svg>
                    <span class="text-xs font-medium" data-translate="prayers">Prayers</span>
                </a>
                <!-- Calendar -->
                <a href="../pages/calendar.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4V1h2v2h6V1h2v2zM3 7v12h18V7H3zm2 2h2v2H5V9zm0 4h2v2H5v-2zm0 4h2v2H5v-2zm4-8h2v2H9V9zm0 4h2v2H9v-2zm0 4h2v2H9v-2zm4-8h2v2h-2V9zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm4-8h2v2h-2V9zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z" />
                </svg>
                    <span class="text-xs font-medium" data-translate="calendar">Calendar</span>
                </a>
                <!-- Settings -->
                <a href="../pages/settings.html" class="flex flex-col items-center px-3 py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.82,11.69,4.82,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
                </svg>
                    <span class="text-xs font-medium" data-translate="settings">Settings</span>
                </a>
            </div>
        </nav>
    </div>

    <script>
        (function () {
            var btn = document.getElementById('darkModeQuickToggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('darkMode', isDark);
            });
        })();
    </script>

    <script>
        (function () {
            // Readings come from Universalis' embeddable JSONP feed
            // (https://universalis.com/<yyyymmdd>/jsonpmass.js), which covers
            // every day of the year and returns the parts in Mass order.
            var MASS_ORDER = [
                { key: 'Mass_R1', label: 'First Reading' },
                { key: 'Mass_Ps', label: 'Responsorial Psalm' },
                { key: 'Mass_R2', label: 'Second Reading' },
                { key: 'Mass_GA', label: 'Gospel Acclamation' },
                { key: 'Mass_G',  label: 'Gospel' }
            ];
            var FETCH_TIMEOUT_MS = 15000;
            var CACHE_PREFIX = 'massReadings-';
            // Universalis' free feed covers a sliding window around today;
            // outside it the request redirects, so navigation is clamped.
            var WINDOW_BACK_DAYS = 3;
            var WINDOW_AHEAD_DAYS = 9;

            var datePicker = document.getElementById('datePicker');
            var prevBtn = document.getElementById('prevDay');
            var nextBtn = document.getElementById('nextDay');
            var todayBtn = document.getElementById('todayBtn');
            var retryBtn = document.getElementById('retryBtn');
            var loadingEl = document.getElementById('readingsLoading');
            var errorEl = document.getElementById('readingsError');
            var errorText = document.getElementById('readingsErrorText');
            var container = document.getElementById('readingsContainer');
            var banner = document.getElementById('dayBanner');
            var dayTitleEl = document.getElementById('liturgicalDayTitle');
            var dateEl = document.getElementById('readingsDate');
            var copyrightEl = document.getElementById('readingsCopyright');

            var currentDate = new Date();
            var currentStamp = null;
            var pendingScript = null;
            var pendingTimer = null;

            function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
            function addDays(d, n) { var c = new Date(d); c.setDate(c.getDate() + n); return c; }
            var windowMin = addDays(startOfDay(new Date()), -WINDOW_BACK_DAYS);
            var windowMax = addDays(startOfDay(new Date()), WINDOW_AHEAD_DAYS);
            function fmtDay(d) {
                return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }

            function stampOf(date) {
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var d = String(date.getDate()).padStart(2, '0');
                return '' + date.getFullYear() + m + d;
            }

            function isoOf(date) {
                var s = stampOf(date);
                return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6);
            }

            function setState(state) {
                loadingEl.classList.toggle('hidden', state !== 'loading');
                errorEl.classList.toggle('hidden', state !== 'error');
                if (state !== 'ready') {
                    container.innerHTML = '';
                    banner.classList.add('hidden');
                    copyrightEl.classList.add('hidden');
                }
            }

            function sectionCard(label, part) {
                var card = document.createElement('article');
                card.className = 'rounded-2xl p-6 bg-white dark:bg-gray-800 shadow-lg';

                var header = document.createElement('div');
                header.className = 'mb-4';
                var chip = document.createElement('span');
                chip.className = 'inline-block text-xs font-bold uppercase tracking-wider text-purple-600 dark:text-purple-300 bg-purple-50 dark:bg-purple-900/40 rounded-full px-3 py-1';
                chip.textContent = label;
                header.appendChild(chip);
                if (part.source) {
                    var source = document.createElement('p');
                    source.className = 'text-sm font-semibold text-gray-500 dark:text-gray-400 mt-2';
                    source.innerHTML = part.source;
                    header.appendChild(source);
                }
                if (part.heading) {
                    var heading = document.createElement('h3');
                    heading.className = 'text-base font-bold italic text-gray-800 dark:text-gray-100 mt-1';
                    heading.innerHTML = part.heading;
                    header.appendChild(heading);
                }
                card.appendChild(header);

                var text = document.createElement('div');
                text.className = 'reading-text text-gray-700 dark:text-gray-300';
                text.innerHTML = part.text || '';
                card.appendChild(text);
                return card;
            }

            function render(data) {
                setState('ready');
                dateEl.textContent = data.date || '';
                dayTitleEl.innerHTML = data.day || '';
                banner.classList.remove('hidden');

                container.innerHTML = '';
                MASS_ORDER.forEach(function (section) {
                    var part = data[section.key];
                    if (part && part.text) {
                        container.appendChild(sectionCard(section.label, part));
                    }
                });

                if (data.copyright && data.copyright.text) {
                    copyrightEl.innerHTML = data.copyright.text;
                    copyrightEl.classList.remove('hidden');
                }
            }

            function cleanupPending() {
                if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
                if (pendingScript && pendingScript.parentNode) {
                    pendingScript.parentNode.removeChild(pendingScript);
                }
                pendingScript = null;
            }

            window.universalisCallback = function (data) {
                cleanupPending();
                if (!data || String(data.number) !== currentStamp) return;
                try {
                    localStorage.setItem(CACHE_PREFIX + currentStamp, JSON.stringify(data));
                } catch (e) {}
                render(data);
            };

            function load(date) {
                currentDate = date;
                currentStamp = stampOf(date);
                datePicker.value = isoOf(date);
                todayBtn.classList.toggle('hidden', currentStamp === stampOf(new Date()));
                prevBtn.disabled = +startOfDay(date) <= +windowMin;
                nextBtn.disabled = +startOfDay(date) >= +windowMax;
                cleanupPending();

                var cached = null;
                try {
                    cached = localStorage.getItem(CACHE_PREFIX + currentStamp);
                } catch (e) {}
                if (cached) {
                    try {
                        render(JSON.parse(cached));
                        return;
                    } catch (e) {}
                }

                // Outside the feed's window nothing can be fetched: say so
                // immediately instead of waiting for the request to time out
                if (+startOfDay(date) < +windowMin || +startOfDay(date) > +windowMax) {
                    errorText.textContent = 'Readings are available from ' + fmtDay(windowMin)
                        + ' to ' + fmtDay(windowMax) + '. Please choose a date in that range.';
                    setState('error');
                    return;
                }
                errorText.textContent = 'Unable to load the readings for this day. Please check your connection and try again.';

                setState('loading');
                var stamp = currentStamp;
                pendingScript = document.createElement('script');
                pendingScript.src = 'https://universalis.com/' + stamp + '/jsonpmass.js';
                pendingScript.onerror = function () {
                    cleanupPending();
                    if (stamp === currentStamp) setState('error');
                };
                pendingTimer = setTimeout(function () {
                    cleanupPending();
                    if (stamp === currentStamp) setState('error');
                }, FETCH_TIMEOUT_MS);
                document.body.appendChild(pendingScript);
            }

            function shiftDay(delta) {
                var next = new Date(currentDate);
                next.setDate(next.getDate() + delta);
                load(next);
            }

            prevBtn.addEventListener('click', function () { shiftDay(-1); });
            nextBtn.addEventListener('click', function () { shiftDay(1); });
            todayBtn.addEventListener('click', function () { load(new Date()); });
            retryBtn.addEventListener('click', function () {
                try { localStorage.removeItem(CACHE_PREFIX + currentStamp); } catch (e) {}
                load(currentDate);
            });
            datePicker.min = isoOf(windowMin);
            datePicker.max = isoOf(windowMax);
            datePicker.addEventListener('change', function () {
                if (!datePicker.value) return;
                var parts = datePicker.value.split('-');
                load(new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
            });

            load(new Date());
        })();
    </script>
    <script src="../js/prayers-nav.js" defer></script>
</body>
</html>
