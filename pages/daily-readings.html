<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7c2133">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ipray">
    <link rel="stylesheet" href="../css/prevent-zoom.css">
    <title>Daily Readings - ipray</title>
    <link rel="icon" href="../assets/images/favicon.ico.jpg" type="image/x-icon">
    <meta name="description" content="Daily Catholic Mass readings for every day of the year, in the proper order of the Mass">
    <!-- Tailwind CSS: locally built (npm run build) -->
    <link rel="stylesheet" href="../dist/output.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/masifu.css">
    <!-- Shared light/dark theme: applies the saved choice before paint -->
    <script src="../js/theme.js"></script>
    <script src="../js/text-size.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/prayer-day.js"></script>
    <script src="../js/library.js" defer></script>
    <script src="../js/home-button.js" defer></script>
    <script src="../js/reminders.js" defer></script>
    <style>
        /* Universalis reading text arrives as HTML with its own indentation styles */
        .reading-text { line-height: 1.75; color: #000; font-weight: 600; }
        .dark .reading-text { color: #eee; }
        .reading-text div { margin-bottom: 0.15rem; }
        /* Kiswahili readings come as whole paragraphs and psalm stanzas,
           not Universalis' one div per line, so they need a real gap. */
        .reading-text .sw-para { margin-bottom: 0.85rem; }
        .reading-text .sw-para:last-child { margin-bottom: 0; }
        /* --prayer-text-scale is set by js/text-size.js (default 1).
           Scoping it to .reading-text — rather than the root <html>
           font-size — keeps #appBar and the Home button, which sit outside
           it, a fixed size when the reading text is enlarged or shrunk. */
        .reading-text { font-size: calc(1rem * var(--prayer-text-scale, 1)); }
        .sw-fallback-note { font-size: 0.85rem; font-style: italic; color: #b91c1c; background: rgba(185,28,28,0.08); border-radius: 0.5rem; padding: 0.6rem 0.9rem; margin: 0 0 1rem; }
        .dark .sw-fallback-note { color: #f87171; background: rgba(248,113,113,0.12); }
    </style>
    <script src="../js/logo-loader.js"></script>
    <link rel="stylesheet" href="../css/status-bar-safe-area.css">
    <script src="../js/status-bar.js" defer></script>
</head>
<body class="page-index min-h-screen bg-gradient-vintage dark:bg-gray-900 transition-colors duration-300">
    <div id="app" class="relative z-10 page-content">
        <header id="appBar" class="app-bar" role="banner">
            <div class="header-content">
                <div class="flex items-center gap-2">
                    <a href="../index.html" class="app-bar-btn" aria-label="Back to home" title="Back to home">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </a>
                    <div class="app-bar-brand">
                        <h1 id="pageTitle" class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                            Daily Readings
                        </h1>
                        <p id="pageSubtitle" class="text-xs text-gray-600 dark:text-gray-400">Mass readings for every day</p>
                    </div>
                </div>
                <button id="darkModeQuickToggle" class="app-bar-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-5 pb-32 pt-6" role="main">
            <!-- Language switch: English / Kiswahili. Remembered in localStorage;
                 switching re-renders instantly, no page reload. -->
            <div class="flex justify-center mb-4">
                <div class="inline-flex rounded-full bg-white dark:bg-gray-800 shadow p-1" role="tablist" aria-label="Choose language / Chagua lugha">
                    <button id="langEn" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors" role="tab">English</button>
                    <button id="langSw" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors" role="tab">Kiswahili</button>
                </div>
            </div>

            <!-- Date navigation: pick any day of any year -->
            <div class="rounded-2xl p-4 bg-white dark:bg-gray-800 shadow-lg mb-6">
                <div class="flex items-center justify-between gap-2">
                    <button id="prevDay" class="p-3 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" aria-label="Previous day">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div class="flex-1 text-center">
                        <input type="date" id="datePicker" class="w-full max-w-[13rem] mx-auto text-center font-semibold bg-transparent text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" aria-label="Choose a date">
                    </div>
                    <button id="nextDay" class="p-3 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" aria-label="Next day">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
                <div class="text-center mt-3">
                    <button id="todayBtn" class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline focus:outline-none hidden">
                        Back to today
                    </button>
                </div>
            </div>

            <!-- Liturgical day banner -->
            <div id="dayBanner" class="liturgical-card mb-6 hidden" data-color="green">
                <div class="text-center">
                    <p id="readingsDate" class="text-sm text-gray-600 dark:text-gray-400 mb-1"></p>
                    <div id="liturgicalDayTitle" class="text-lg font-bold text-gray-800 dark:text-gray-100"></div>
                </div>
            </div>

            <!-- Loading state -->
            <div id="readingsLoading" class="text-center py-12">
                <div class="inline-block w-10 h-10 border-4 border-purple-600 border-t-transparent rounded-full animate-spin" aria-hidden="true"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Loading readings…</p>
            </div>

            <!-- Error state -->
            <div id="readingsError" class="rounded-2xl p-6 bg-white dark:bg-gray-800 shadow-lg text-center hidden">
                <p id="readingsErrorText" class="text-gray-700 dark:text-gray-300 mb-4">Unable to load the readings for this day. Please check your connection and try again.</p>
                <button id="retryBtn" class="px-6 py-2 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold">Retry</button>
            </div>

            <div id="readingsSwNote" class="sw-fallback-note hidden"></div>

            <!-- Readings rendered here in the order of the Mass -->
            <div id="readingsContainer" class="space-y-6"></div>

            <p id="readingsCopyright" class="text-xs text-gray-500 dark:text-gray-400 text-center mt-8 hidden"></p>
        </main>

    </div>

    <script>
        (function () {
            var btn = document.getElementById('darkModeQuickToggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                window.IPrayTheme.toggle();
            });
        })();
    </script>

    <script src="../js/fetch-first.js"></script>
    <script>
        (function () {
            // Readings come from Universalis' embeddable JSONP feed
            // (https://universalis.com/<yyyymmdd>/jsonpmass.js), which covers
            // every day of the year and returns the parts in Mass order.
            var MASS_ORDER = [
                { key: 'Mass_R1', label: 'First Reading' },
                { key: 'Mass_Ps', label: 'Responsorial Psalm' },
                { key: 'Mass_R2', label: 'Second Reading' },
                { key: 'Mass_GA', label: 'Gospel Acclamation' },
                { key: 'Mass_G',  label: 'Gospel' }
            ];
            var FETCH_TIMEOUT_MS = 10000;
            var CACHE_PREFIX = 'massReadings-';
            // Universalis' free feed covers a sliding window around today;
            // outside it the request redirects, so navigation is clamped.
            var WINDOW_BACK_DAYS = 3;
            var WINDOW_AHEAD_DAYS = 9;

            var datePicker = document.getElementById('datePicker');
            var prevBtn = document.getElementById('prevDay');
            var nextBtn = document.getElementById('nextDay');
            var todayBtn = document.getElementById('todayBtn');
            var retryBtn = document.getElementById('retryBtn');
            var loadingEl = document.getElementById('readingsLoading');
            var errorEl = document.getElementById('readingsError');
            var errorText = document.getElementById('readingsErrorText');
            var container = document.getElementById('readingsContainer');
            var banner = document.getElementById('dayBanner');
            var dayTitleEl = document.getElementById('liturgicalDayTitle');
            var dateEl = document.getElementById('readingsDate');
            var copyrightEl = document.getElementById('readingsCopyright');
            var readingsSwNote = document.getElementById('readingsSwNote');
            var pageTitleEl = document.getElementById('pageTitle');
            var pageSubtitleEl = document.getElementById('pageSubtitle');
            var langEnBtn = document.getElementById('langEn');
            var langSwBtn = document.getElementById('langSw');

            var currentDate = new Date();
            var currentStamp = null;
            var pendingScript = null;
            var pendingTimer = null;
            var gospelOnly = new URLSearchParams(window.location.search).get('view') === 'gospel';
            var gospelEmbed = gospelOnly && new URLSearchParams(window.location.search).get('embed') === '1';
            if (gospelOnly) {
                document.body.classList.add('masifu-modern', 'gospel-only');
                document.documentElement.lang = 'sw';
            }

            // Language switch: English / Kiswahili, the app's setting
            // (js/i18n.js).
            var lang = gospelOnly ? 'sw' : IPrayI18n.prayerLang();

            // Kiswahili daily readings: there is no API for this (checked
            // Universalis, iBreviary, Divine Office - none publish Swahili).
            // mkatolikileo.com is a Swahili Catholic news site that posts the
            // full text of each day's Mass readings as a dated article; it has
            // no CORS headers either, so it's fetched through the same proxy
            // chain used for Universalis in prayer-hour.html. If a date isn't
            // published there yet (it posts each day only a few days ahead)
            // the English Universalis feed is shown instead, with a note
            // explaining why.
            var SW_SITE = 'https://mkatolikileo.com';
            var SW_LIST_URL = SW_SITE + '/masomo-ya-misa';
            // v3: days cached by v2 hold raw Markdown (**, _, 1\.) and
            // first-paragraph-only readings.
            var SW_CACHE_PREFIX = 'swReadings-v3-';
            var SW_LIST_CACHE_KEY = 'swReadingsListMap';
            var SW_LIST_TTL_MS = 6 * 60 * 60 * 1000;
            var SW_WEEKDAYS = ['jumapili', 'jumatatu', 'jumanne', 'jumatano', 'alhamisi', 'ijumaa', 'jumamosi'];
            var SW_MONTH_SLUGS = ['januari', 'februari', 'machi', 'aprili', 'mei', 'juni', 'julai', 'agosti', 'septemba', 'oktoba', 'novemba', 'desemba'];
            // The app's Cloudflare Worker (cloudflare-worker/ipray-worker.js)
            // serves the site's pages with CORS, cached at the edge: asked
            // first. Until its mkatolikileo route is deployed it answers
            // these paths with a 404, and the others are asked at once.
            var SW_WORKER = 'https://ancient-rice-28a1.otienocollo95.workers.dev/mkatolikileo';
            // r.jina.ai ("Reader") fetches a page server-side and returns
            // clean Markdown with CORS already open - no proxy needed. Asked
            // next; the raw-HTML proxy chain below is kept as a fallback
            // only. Both parsers follow the site's layout, so a redesign
            // (as in October 2026) needs them both updated: the saved pages
            // in tests/fixtures/mkatolikileo/ show the current one.
            var SW_READER_PREFIX = 'https://r.jina.ai/';
            // The Reader renders a page it hasn't seen lately in a browser
            // first: the list of days took 9 s, so js/fetch-first.js's
            // default 10 s per request would often cut it off.
            var SW_FETCH_TIMEOUT_MS = 15000;
            var SW_PROXIES = [
                function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
                function (u) { return 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u); },
                function (u) { return 'https://api.cors.lol/?url=' + encodeURIComponent(u); },
                function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); }
            ];
            var SW_MONTHS = {
                januari: 0, februari: 1, machi: 2, aprili: 3, mei: 4, juni: 5,
                julai: 6, agosti: 7, septemba: 8, oktoba: 9, novemba: 10, desemba: 11
            };

            function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
            function addDays(d, n) { var c = new Date(d); c.setDate(c.getDate() + n); return c; }
            var windowMin = addDays(startOfDay(new Date()), -WINDOW_BACK_DAYS);
            var windowMax = addDays(startOfDay(new Date()), WINDOW_AHEAD_DAYS);
            function fmtDay(d) {
                if (lang === 'sw') {
                    var cap = function (w) { return w.charAt(0).toUpperCase() + w.slice(1); };
                    return cap(SW_WEEKDAYS[d.getDay()]) + ', ' + cap(SW_MONTH_SLUGS[d.getMonth()]) + ' ' + d.getDate();
                }
                return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }

            function stampOf(date) {
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var d = String(date.getDate()).padStart(2, '0');
                return '' + date.getFullYear() + m + d;
            }

            function isoOf(date) {
                var s = stampOf(date);
                return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6);
            }

            function setState(state) {
                loadingEl.classList.toggle('hidden', state !== 'loading');
                errorEl.classList.toggle('hidden', state !== 'error');
                if (state !== 'ready') {
                    container.innerHTML = '';
                    banner.classList.add('hidden');
                    copyrightEl.classList.add('hidden');
                }
            }

            function sectionCard(label, part) {
                var card = document.createElement('article');
                card.className = 'rounded-2xl p-6 bg-white dark:bg-gray-800 shadow-lg';
                if (gospelOnly) card.classList.add('masifu-gospel-card');

                var header = document.createElement('div');
                header.className = 'mb-4';
                var chip = document.createElement('span');
                chip.className = 'inline-block text-xs font-bold uppercase tracking-wider text-purple-600 dark:text-purple-300 bg-purple-50 dark:bg-purple-900/40 rounded-full px-3 py-1';
                chip.textContent = label;
                header.appendChild(chip);
                if (part.source) {
                    var source = document.createElement('p');
                    source.className = 'text-sm font-semibold text-gray-500 dark:text-gray-400 mt-2';
                    source.innerHTML = part.source;
                    header.appendChild(source);
                }
                if (part.heading) {
                    var heading = document.createElement('h3');
                    heading.className = 'text-base font-bold italic text-gray-800 dark:text-gray-100 mt-1';
                    heading.innerHTML = part.heading;
                    header.appendChild(heading);
                }
                card.appendChild(header);

                var text = document.createElement('div');
                text.className = 'reading-text text-gray-700 dark:text-gray-300';
                text.innerHTML = part.text || '';
                card.appendChild(text);
                return card;
            }

            function sendEmbeddedGospel(status, gospel, message) {
                if (!gospelEmbed || window.parent === window) return;
                window.parent.postMessage({
                    type: 'daily-gospel-content',
                    status: status,
                    gospel: gospel,
                    message: message
                }, window.location.origin);
            }

            function render(data) {
                setState('ready');
                dateEl.textContent = data.date || '';
                dayTitleEl.innerHTML = data.day || '';
                banner.classList.remove('hidden');

                container.innerHTML = '';
                MASS_ORDER.forEach(function (section) {
                    var part = data[section.key];
                    if (part && part.text) {
                        container.appendChild(sectionCard(section.label, part));
                    }
                });

                if (data.copyright && data.copyright.text) {
                    copyrightEl.innerHTML = data.copyright.text;
                    copyrightEl.classList.remove('hidden');
                }
            }

            function renderSw(parsed) {
                setState('ready');
                if (!gospelOnly) {
                    dateEl.textContent = parsed.dateLabel || '';
                    dayTitleEl.textContent = parsed.dayTitle || '';
                    banner.classList.remove('hidden');
                }

                container.innerHTML = '';
                var sections = parsed.sections || [];
                var renderedGospel = null;
                for (var i = 0; i < sections.length; i++) {
                    var s = sections[i];
                    if (gospelOnly && !isSwGospelLabel(s.label)) continue;
                    container.appendChild(sectionCard(s.label, { source: swEscape(s.citation || ''), text: s.textHtml }));
                    if (gospelOnly && isSwGospelLabel(s.label)) {
                        renderedGospel = {
                            label: s.label,
                            citation: s.citation || '',
                            textHtml: s.textHtml
                        };
                    }
                    // Stop at the Gospel — nothing after Injili should render.
                    if (isSwGospelLabel(s.label)) break;
                }

                if (gospelOnly && !container.children.length) {
                    var unavailable = 'Injili ya Kiswahili haipatikani kwa siku hii.';
                    errorText.textContent = unavailable;
                    setState('error');
                    sendEmbeddedGospel('error', null, unavailable);
                    return;
                }

                if (!gospelOnly) {
                    copyrightEl.textContent = 'Masomo yametolewa na Mkatoliki Leo.';
                    copyrightEl.classList.remove('hidden');
                }

                if (gospelOnly) sendEmbeddedGospel('ready', renderedGospel);
            }

            // Reject a parsed article whose date does not match the day we
            // asked for (guards against a wrong projected id).
            function swParsedMatchesStamp(parsed, stamp) {
                if (!parsed) return false;
                var found = parsed.date || swLabelStamp(parsed.dateLabel);
                return !found || found === stamp; // no date on the page — trust the URL slug
            }

            // "Jumanne, 20 Oktoba 2026" to "20261020", or '' if it holds no
            // date.
            function swLabelStamp(label) {
                var m = String(label || '').match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
                var monthIdx = m ? SW_MONTHS[m[2].toLowerCase()] : undefined;
                return monthIdx === undefined ? '' : stampOf(new Date(Number(m[3]), monthIdx, Number(m[1])));
            }

            function showSwUnavailable(offline) {
                readingsSwNote.textContent = offline
                    ? 'Uko nje ya mtandao, na masomo ya Kiswahili ya siku hii hayajahifadhiwa kwenye simu hii. Yanaonyeshwa kwa Kiingereza.'
                    : 'Masomo ya Kiswahili ya siku hii hayapatikani kwa sasa. Yanaonyeshwa kwa Kiingereza.';
                readingsSwNote.classList.remove('hidden');
            }

            // Fetches a mkatolikileo.com page through the Worker (HTML) first
            // and, if it doesn't answer, the Reader (Markdown) and the
            // raw-HTML proxies all together (js/fetch-first.js).
            // parse(text, viaReader) turns an answer into a result, or null
            // if it doesn't hold one.
            function fetchSwPage(url, parse) {
                var routes = [SW_WORKER + url.slice(SW_SITE.length), SW_READER_PREFIX + url]
                    .concat(SW_PROXIES.map(function (build) { return build(url); }));
                return IPrayFetch.first(routes, function (text, i) { return parse(text, i === 1); }, { timeout: SW_FETCH_TIMEOUT_MS });
            }

            // Fetches one day's article. onOk receives an already-parsed
            // {dayTitle, dateLabel, sections} object, from the Reader's
            // Markdown or from the site's HTML.
            function fetchSwArticle(url, onOk, onFail) {
                fetchSwPage(url, function (text, viaReader) {
                    return viaReader ? parseSwArticleText(text) : parseSwArticle(text);
                }).then(onOk, function () { onFail(); });
            }

            // The listing page (reverse-chronological, ~10 most recent days)
            // is the only reliable way to map a date to its article id/URL:
            // mkatolikileo.com's ids increment roughly one per published day,
            // but there's no guarantee against gaps, so ids are never guessed.
            function parseSwListHtml(html) {
                var map = {};
                var re = /masomo-ya-misa\/(\d+)\/([a-z]+)-([a-z]+)-(\d{1,2})-(\d{4})/g;
                var m;
                while ((m = re.exec(html))) {
                    var monthIdx = SW_MONTHS[m[3]];
                    if (monthIdx === undefined) continue;
                    var d = new Date(Number(m[5]), monthIdx, Number(m[4]));
                    var daySlug = String(Number(m[4])).padStart(2, '0');
                    map[stampOf(d)] = SW_SITE + '/masomo-ya-misa/' + m[1] + '/' + m[2] + '-' + m[3] + '-' + daySlug + '-' + m[5];
                }
                return map;
            }

            function buildSwArticleUrl(date, articleId) {
                var dd = String(date.getDate()).padStart(2, '0');
                return SW_SITE + '/masomo-ya-misa/' + articleId + '/'
                    + SW_WEEKDAYS[date.getDay()] + '-'
                    + SW_MONTH_SLUGS[date.getMonth()] + '-'
                    + dd + '-' + date.getFullYear();
            }

            // The listing page often lags behind newly published articles
            // (today can already be live while the index still ends at
            // yesterday). Article ids increment roughly one per day, so
            // when a stamp is missing we project a URL from the nearest
            // known listing entry and verify it by fetching.
            function guessSwArticleUrl(date, map) {
                if (!map) return null;
                var target = startOfDay(date).getTime();
                var best = null;
                Object.keys(map).forEach(function (stamp) {
                    var y = Number(stamp.slice(0, 4));
                    var mo = Number(stamp.slice(4, 6)) - 1;
                    var da = Number(stamp.slice(6, 8));
                    var t = new Date(y, mo, da).getTime();
                    var idMatch = String(map[stamp]).match(/masomo-ya-misa\/(\d+)\//);
                    if (!idMatch) return;
                    var delta = Math.abs(t - target);
                    if (!best || delta < best.delta) {
                        best = { t: t, id: Number(idMatch[1]), delta: delta };
                    }
                });
                if (!best) return null;
                var dayDiff = Math.round((target - best.t) / 86400000);
                var guessedId = best.id + dayDiff;
                if (guessedId < 1) return null;
                return buildSwArticleUrl(date, guessedId);
            }

            function rememberSwListUrl(stamp, url) {
                try {
                    var cached = JSON.parse(localStorage.getItem(SW_LIST_CACHE_KEY) || 'null') || { map: {} };
                    cached.map = cached.map || {};
                    cached.map[stamp] = url;
                    cached.fetchedAt = Date.now();
                    localStorage.setItem(SW_LIST_CACHE_KEY, JSON.stringify(cached));
                } catch (e) {}
            }

            // neededStamp: if the cached map is still fresh but lacks this
            // date, refetch so newly published days are not stuck behind
            // the 6h TTL.
            function resolveSwListMap(neededStamp, cb) {
                var cached = null;
                try { cached = JSON.parse(localStorage.getItem(SW_LIST_CACHE_KEY) || 'null'); } catch (e) {}
                var cacheFresh = cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < SW_LIST_TTL_MS;
                var cacheHasStamp = !!(neededStamp && cached && cached.map && cached.map[neededStamp]);
                if (cacheFresh && (!neededStamp || cacheHasStamp)) {
                    cb(cached.map);
                    return;
                }

                // parseSwListHtml just regex-scans for article URLs, so it
                // works equally well on the Reader's Markdown or on raw
                // HTML from the proxies.
                fetchSwPage(SW_LIST_URL, function (text) {
                    var found = parseSwListHtml(text);
                    return Object.keys(found).length ? found : null;
                }).then(function (map) {
                    // Keep any previously remembered (guessed) URLs that
                    // the listing still doesn't show.
                    if (cached && cached.map) {
                        Object.keys(cached.map).forEach(function (k) {
                            if (!map[k]) map[k] = cached.map[k];
                        });
                    }
                    try { localStorage.setItem(SW_LIST_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), map: map })); } catch (e) {}
                    cb(map);
                }, function () {
                    cb(cached ? cached.map : null);
                });
            }

            // Pulls the day title and each reading (label + citation + text)
            // out of a fetched mkatolikileo.com article page. Its <article>
            // holds an <h1> (the day), a <time datetime="yyyy-mm-dd"> and a
            // <section> per reading, headed by an <h2> (the label) beside
            // the citation; the comments are a <section> too, after the
            // Gospel.
            function parseSwArticle(html) {
                var doc = new DOMParser().parseFromString(html, 'text/html');
                var titleEl = doc.querySelector('article h1');
                if (!titleEl) return null;
                var article = titleEl.closest('article');
                var timeEl = article.querySelector('time');
                var date = timeEl ? String(timeEl.getAttribute('datetime') || '').replace(/-/g, '').slice(0, 8) : '';

                var sections = [];
                var blocks = article.querySelectorAll('section');
                for (var b = 0; b < blocks.length; b++) {
                    var labelEl = blocks[b].querySelector('h2');
                    if (!labelEl) continue;
                    var citeEl = labelEl.nextElementSibling;
                    // The section's child holding the label and citation;
                    // the reading is everything after it.
                    var head = labelEl;
                    while (head.parentNode !== blocks[b]) head = head.parentNode;
                    var paras = [];
                    for (var c = blocks[b].firstElementChild; c; c = c.nextElementSibling) {
                        if (c !== head && c !== citeEl) paras = paras.concat(swParagraphs(c));
                    }
                    var textHtml = swParasToHtml(paras);
                    if (!textHtml) continue;
                    var label = swNodeText(labelEl);
                    sections.push({ label: label, citation: citeEl ? swNodeText(citeEl) : '', textHtml: textHtml });
                    if (isSwGospelLabel(label)) break;
                }
                if (!sections.length) return null;
                return {
                    dayTitle: swNodeText(titleEl),
                    dateLabel: timeEl ? swNodeText(timeEl) : '',
                    date: /^\d{8}$/.test(date) ? date : '',
                    sections: sections
                };
            }

            function isSwGospelLabel(label) {
                return /^injili\b/i.test(String(label || '').replace(/\*/g, '').trim());
            }

            function isSwFooterLine(line) {
                var t = String(line || '').trim();
                if (!t) return false;
                if (/^\d+\s*Imependwa/.test(t)) return true;
                if (/^#{1,3}\s*Maoni\b/i.test(t)) return true;
                if (/^---+/.test(t)) return true;
                // Nav / footer markdown links that follow the Gospel on the site.
                if (/^\*\s+\[[^\]]+\]\([^)]+\)/.test(t)) return true;
                if (/^-\s+\[[^\]]+\]\([^)]+\)/.test(t)) return true;
                if (/^\[[^\]]+\]\(https?:\/\/mkatolikileo\.com/i.test(t)) return true;
                if (/^\[?\d+\]?\s*Imependwa/i.test(t)) return true;
                return false;
            }

            // Parses the Markdown that r.jina.ai's Reader returns for a
            // mkatolikileo.com article. It drops the page's <h1>, so the
            // day comes from the "Title: Masomo ya Misa: <day>, <weekday>,
            // <date>" line; the date line ("Jumanne, 20 Oktoba 2026 · Mwaka
            // A · ...") comes before the readings. Each reading is a "##
            // <label>" heading ("Somo la Kwanza", "Wimbo wa Katikati", "Somo
            // la Pili" on Sundays and solemnities, "Shangilio la Injili",
            // "Injili"), the citation on the next line, then the text up to
            // the next heading. Parsing stops at Injili, so the reflection
            // link and the comments after it never render.
            function parseSwArticleText(md) {
                if (!md) return null;
                var lines = String(md).replace(/\r\n/g, '\n').split('\n');
                var dayTitle = '', dateLabel = '', titleDate = '', start = 0;
                var weekdaySplit = new RegExp('^(.*?),\\s*((?:' + SW_WEEKDAYS.join('|') + '),?\\s+\\d{1,2}\\s+[A-Za-z]+\\s+\\d{4})$', 'i');
                for (var i = 0; i < lines.length; i++) {
                    var title = lines[i].match(/^Title:\s*(?:Masomo ya Misa\s*:\s*)?(.+?)\s*$/i);
                    if (title) {
                        var day = title[1].match(weekdaySplit);
                        dayTitle = swPlain(day ? day[1] : title[1]);
                        titleDate = day ? swPlain(day[2]) : '';
                    }
                    if (/^Markdown Content:/.test(lines[i])) { start = i + 1; break; }
                }

                var sections = [];
                for (i = start; i < lines.length; i++) {
                    var heading = lines[i].match(/^#{1,3}\s+(.+?)\s*$/);
                    if (!heading) {
                        if (!sections.length && !dateLabel && swLabelStamp(lines[i])) dateLabel = swPlain(lines[i].split('·')[0]);
                        continue;
                    }
                    var body = [];
                    for (var j = i + 1; j < lines.length && !/^#{1,6}\s/.test(lines[j]); j++) body.push(lines[j]);
                    i = j - 1;
                    // A heading that is a link is a list entry, not a reading
                    if (/^\[.*\]\(.*\)$/.test(heading[1])) continue;
                    var label = swPlain(heading[1]);
                    if (/^Maoni\b/i.test(label)) break;
                    while (body.length && !body[0].trim()) body.shift();
                    var citation = '';
                    if (body.length && /\d/.test(body[0]) && body[0].trim().length <= 80) citation = swPlain(body.shift());
                    var textHtml = swTextToHtml(body.join('\n'));
                    if (!textHtml) continue;
                    sections.push({ label: label, citation: citation, textHtml: textHtml });
                    if (isSwGospelLabel(label)) break;
                }
                if (!sections.length) return null;
                return { dayTitle: dayTitle, dateLabel: dateLabel || titleDate, sections: sections };
            }

            function swEscape(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            // Rebuilds a node of the site's HTML keeping only the text, line
            // breaks and bold/italic (the "K." refrains, "Neno la Bwana"):
            // no links, images, attributes or site widgets.
            function swCleanNode(node) {
                var out = '';
                for (var c = node.firstChild; c; c = c.nextSibling) {
                    if (c.nodeType === 3) { out += swEscape(c.nodeValue.replace(/\s+/g, ' ')); continue; }
                    if (c.nodeType !== 1) continue;
                    var tag = c.tagName.toLowerCase();
                    if (/^(script|style|form|iframe|object|embed|nav|button|img|svg|video|audio|select|input|textarea)$/.test(tag)) continue;
                    if (tag === 'br') { out += '<br>'; continue; }
                    var inner = swCleanNode(c);
                    if (tag === 'b' || tag === 'strong') out += '<strong>' + inner + '</strong>';
                    else if (tag === 'i' || tag === 'em') out += '<em>' + inner + '</em>';
                    else if (/^(p|div|li|h\d)$/.test(tag)) out += inner + '<br>';
                    else out += inner;
                }
                return out;
            }
            // One part of a reading on the site, as paragraphs: a block that
            // holds two or more blocks (the psalm's stanzas and refrains) is
            // split into them; any other block (a reading, the refrain with
            // its "K.", "Neno la Bwana") is one paragraph.
            var SW_BLOCK_TAG = /^(p|div|blockquote|ul|ol|li|h[1-6])$/i;
            function swParagraphs(node) {
                var blocks = 0;
                for (var c = node.firstElementChild; c; c = c.nextElementSibling) {
                    if (SW_BLOCK_TAG.test(c.tagName)) blocks++;
                }
                if (blocks < 2) {
                    var html = swCleanNode(node).replace(/\s*<br>\s*/g, '<br>').replace(/^(\s|<br>)+|(\s|<br>)+$/g, '');
                    return html && !isSwFooterLine(node.textContent) ? [html] : [];
                }
                var out = [], run = null;
                for (var k = node.firstChild; k; k = k.nextSibling) {
                    if (k.nodeType === 1 && SW_BLOCK_TAG.test(k.tagName)) {
                        if (run) out = out.concat(swParagraphs(run));
                        run = null;
                        out = out.concat(swParagraphs(k));
                    } else {
                        run = run || node.ownerDocument.createElement('div');
                        run.appendChild(k.cloneNode(true));
                    }
                }
                if (run) out = out.concat(swParagraphs(run));
                return out;
            }
            // A reading's paragraphs (inner HTML) to the page's HTML. The
            // psalm's refrain ("K. ...") is in bold, as on the site; the
            // Reader puts the first one's "K." on a line of its own.
            function swParasToHtml(paras) {
                var out = '';
                for (var i = 0; i < paras.length; i++) {
                    var p = paras[i];
                    if (p === 'K.' && i + 1 < paras.length) p = 'K. ' + paras[++i];
                    if (/^K\.\s/.test(p)) p = '<strong>' + p + '</strong>';
                    out += '<div class="sw-para">' + p + '</div>';
                }
                return out;
            }
            function swNodeText(el) {
                return el.textContent.replace(/\s+/g, ' ').replace(/ ,/g, ',').trim();
            }
            // Inline Markdown from the Reader (Turndown output) to HTML:
            // images dropped, links unwrapped, **bold**/_italic_ rendered and
            // Turndown's backslash escapes ("1\.", "\*", "\[") undone, so
            // none of the syntax shows up in the reading.
            function swInlineToHtml(md) {
                var kept = [];
                var s = String(md || '')
                    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                    .replace(/\\([\\`*_{}\[\]()#+\-.!<>|~=])/g, function (m, ch) {
                        kept.push(ch);
                        return '\u0000' + (kept.length - 1) + '\u0000';
                    });
                s = swEscape(s)
                    .replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, '<strong>$2</strong>')
                    .replace(/\*(?=\S)([^*]*?\S)\*/g, '<em>$1</em>')
                    .replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<em>$2</em>');
                return s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return swEscape(kept[Number(i)]); });
            }
            // Label, citation and day title: plain text, no Markdown.
            function swPlain(md) {
                var div = document.createElement('div');
                div.innerHTML = swInlineToHtml(md);
                return div.textContent.replace(/\s+/g, ' ').replace(/ ,/g, ',').trim();
            }
            function swTextToHtml(text) {
                // Drop leftover nav/footer lines and lines of nothing but
                // links or images (the reflection and next/previous day
                // links after the Gospel are one such line).
                var cleaned = String(text || '').split('\n').filter(function (ln) {
                    var t = ln.trim();
                    return !isSwFooterLine(t) && !/^(!?\[[^\]]*\]\([^)]*\)\s*)+$/.test(t);
                }).join('\n');
                return swParasToHtml(cleaned.split(/\n\s*\n/).map(function (p) {
                    // Turndown writes <br> as two trailing spaces (or a
                    // backslash) before the newline.
                    return swInlineToHtml(p.trim()).split(/ *\\?\n/)
                        .map(function (l) { return l.trim(); }).filter(Boolean).join('<br>');
                }).filter(Boolean));
            }

            function fetchErrorText() {
                if (IPrayFetch.isOffline()) {
                    return lang === 'sw'
                        ? 'Uko nje ya mtandao. Unganisha mtandao kisha ujaribu tena.'
                        : "You're offline. Connect and try again.";
                }
                return lang === 'sw'
                    ? 'Imeshindikana kupakia masomo ya siku hii. Tafadhali angalia mtandao wako na ujaribu tena.'
                    : 'Unable to load the readings for this day. Please check your connection and try again.';
            }

            function windowErrorText() {
                return (lang === 'sw' ? 'Masomo yanapatikana kuanzia ' : 'Readings are available from ')
                    + fmtDay(windowMin) + (lang === 'sw' ? ' hadi ' : ' to ')
                    + fmtDay(windowMax) + (lang === 'sw' ? '. Tafadhali chagua tarehe kati ya hizo.' : '. Please choose a date in that range.');
            }

            var CHROME = {
                en: { title: 'Daily Readings', subtitle: 'Mass readings for every day', loading: 'Loading readings…', retry: 'Retry', today: 'Back to today' },
                sw: { title: 'Masomo ya Siku', subtitle: 'Masomo ya siku', loading: 'Inapakia masomo…', retry: 'Jaribu tena', today: 'Rudi leo' }
            };

            function applyLangChrome() {
                var c = CHROME[lang];
                pageTitleEl.textContent = c.title;
                pageSubtitleEl.textContent = c.subtitle;
                document.title = c.title + ' - ipray';
                var loadingText = loadingEl.querySelector('p');
                if (loadingText) loadingText.textContent = c.loading;
                retryBtn.textContent = c.retry;
                todayBtn.textContent = c.today;
                document.documentElement.lang = lang === 'sw' ? 'sw' : 'en';
                [[langEnBtn, 'en'], [langSwBtn, 'sw']].forEach(function (pair) {
                    var active = lang === pair[1];
                    pair[0].className = 'px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ' + (active
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'
                        : 'text-gray-600 dark:text-gray-300');
                    pair[0].setAttribute('aria-selected', String(active));
                });
            }

            function setLang(newLang) {
                if (newLang === lang) return;
                // Saved and passed to every open page by js/i18n.js, which
                // calls showLang below.
                IPrayI18n.set(newLang);
            }

            function showLang(newLang) {
                if (gospelOnly || newLang === lang) return;
                lang = newLang;
                applyLangChrome();
                load(currentDate);
            }

            function cleanupPending() {
                if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
                if (pendingScript && pendingScript.parentNode) {
                    pendingScript.parentNode.removeChild(pendingScript);
                }
                pendingScript = null;
            }

            window.universalisCallback = function (data) {
                cleanupPending();
                if (!data || String(data.number) !== currentStamp) return;
                try {
                    localStorage.setItem(CACHE_PREFIX + currentStamp, JSON.stringify(data));
                } catch (e) {}
                render(data);
            };

            function loadEnglish(date) {
                var stamp = stampOf(date);
                var cached = null;
                try {
                    cached = localStorage.getItem(CACHE_PREFIX + stamp);
                } catch (e) {}
                if (cached) {
                    try {
                        render(JSON.parse(cached));
                        return;
                    } catch (e) {}
                }

                errorText.textContent = fetchErrorText();
                if (IPrayFetch.isOffline()) {
                    setState('error');
                    return;
                }
                setState('loading');
                pendingScript = document.createElement('script');
                pendingScript.src = 'https://universalis.com/' + stamp + '/jsonpmass.js';
                pendingScript.onerror = function () {
                    cleanupPending();
                    if (stamp === currentStamp) setState('error');
                };
                pendingTimer = setTimeout(function () {
                    cleanupPending();
                    if (stamp === currentStamp) setState('error');
                }, FETCH_TIMEOUT_MS);
                document.body.appendChild(pendingScript);
            }

            function loadSwahili(date) {
                var stamp = stampOf(date);
                var cachedSw = null;
                try { cachedSw = localStorage.getItem(SW_CACHE_PREFIX + stamp); } catch (e) {}
                if (cachedSw) {
                    try {
                        renderSw(JSON.parse(cachedSw));
                        return;
                    } catch (e) {}
                }

                errorText.textContent = fetchErrorText();
                setState('loading');

                function onSwFail() {
                    if (stamp !== currentStamp) return;
                    var offline = IPrayFetch.isOffline();
                    if (gospelOnly) {
                        var unavailable = offline
                            ? 'Uko nje ya mtandao. Unganisha mtandao kisha ujaribu tena.'
                            : 'Injili ya Kiswahili ya siku hii haipatikani kwa sasa. Tafadhali jaribu tena.';
                        errorText.textContent = unavailable;
                        setState('error');
                        sendEmbeddedGospel('error', null, unavailable);
                        return;
                    }
                    // Offline, the English readings show only if they were
                    // saved on an earlier visit; otherwise loadEnglish says
                    // the phone is offline and no note is needed.
                    var englishSaved = false;
                    try { englishSaved = !!localStorage.getItem(CACHE_PREFIX + stamp); } catch (e) {}
                    if (!offline || englishSaved) showSwUnavailable(offline);
                    loadEnglish(date);
                }

                function onSwOk(url, parsed) {
                    if (stamp !== currentStamp) return;
                    rememberSwListUrl(stamp, url);
                    try { localStorage.setItem(SW_CACHE_PREFIX + stamp, JSON.stringify(parsed)); } catch (e) {}
                    renderSw(parsed);
                }

                function tryUrl(url, onFail) {
                    if (!url) { onFail(); return; }
                    fetchSwArticle(url, function (parsed) {
                        if (!swParsedMatchesStamp(parsed, stamp)) { onFail(); return; }
                        onSwOk(url, parsed);
                    }, onFail);
                }

                resolveSwListMap(stamp, function (map) {
                    if (stamp !== currentStamp) return;
                    var listed = map && map[stamp];
                    if (listed) {
                        tryUrl(listed, function () {
                            // Listed URL failed; try a projected id in case
                            // the listing entry is stale/wrong.
                            var guessed = guessSwArticleUrl(date, map);
                            if (guessed && guessed !== listed) tryUrl(guessed, onSwFail);
                            else onSwFail();
                        });
                        return;
                    }
                    // Not on the index yet (common for "today") — project
                    // from the nearest known article id and verify by fetch.
                    tryUrl(guessSwArticleUrl(date, map), onSwFail);
                });
            }

            function load(date) {
                currentDate = date;
                currentStamp = stampOf(date);
                datePicker.value = isoOf(date);
                todayBtn.classList.toggle('hidden', currentStamp === stampOf(new Date()));
                prevBtn.disabled = +startOfDay(date) <= +windowMin;
                nextBtn.disabled = +startOfDay(date) >= +windowMax;
                cleanupPending();
                readingsSwNote.classList.add('hidden');
                readingsSwNote.textContent = '';

                // Outside the feed's window nothing can be fetched: say so
                // immediately instead of waiting for the request to time out
                if (+startOfDay(date) < +windowMin || +startOfDay(date) > +windowMax) {
                    errorText.textContent = windowErrorText();
                    setState('error');
                    return;
                }

                if (lang === 'sw') {
                    loadSwahili(date);
                } else {
                    loadEnglish(date);
                }
            }

            function shiftDay(delta) {
                var next = new Date(currentDate);
                next.setDate(next.getDate() + delta);
                load(next);
            }

            prevBtn.addEventListener('click', function () { shiftDay(-1); });
            nextBtn.addEventListener('click', function () { shiftDay(1); });
            todayBtn.addEventListener('click', function () { load(new Date()); });
            retryBtn.addEventListener('click', function () {
                try {
                    localStorage.removeItem(CACHE_PREFIX + currentStamp);
                    localStorage.removeItem(SW_CACHE_PREFIX + currentStamp);
                    // Force a fresh listing fetch so newly published Swahili
                    // articles are not hidden by a stale 6h list cache.
                    localStorage.removeItem(SW_LIST_CACHE_KEY);
                } catch (e) {}
                load(currentDate);
            });
            datePicker.min = isoOf(windowMin);
            datePicker.max = isoOf(windowMax);
            datePicker.addEventListener('change', function () {
                if (!datePicker.value) return;
                var parts = datePicker.value.split('-');
                load(new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
            });

            langEnBtn.addEventListener('click', function () { setLang('en'); });
            langSwBtn.addEventListener('click', function () { setLang('sw'); });
            // Follow the language when it changes here or on another page.
            IPrayI18n.onChange(function () { showLang(IPrayI18n.prayerLang()); });

            applyLangChrome();
            // Today, or the day of the saved week chosen in Settings
            load(window.IPrayDay ? IPrayDay.today() : new Date());
        })();
    </script>
    <script src="../js/app-options.js" defer></script>
    <script src="../js/text-size-control.js" defer></script>
    <script src="../js/prevent-zoom.js" defer></script>
</body>
