    <canvas id="pdfCanvas" class="border rounded shadow w-full max-w-4xl"></canvas>

    <div class="text-sm mt-2 text-center">
        Page <span id="pageNum">1</span> of <span id="pageCount">--</span>

    <script>
        // Ensure pdfjsLib is available
        const url = document.body.getAttribute('data-src');

        let pdfDoc = null;
        let pageNum = 1;
        let currentScale = 1.5;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        function renderPage(num) {
            pdfDoc.getPage(num).then((page) => {
                const viewport = page.getViewport({ scale: currentScale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                page.render({ canvasContext: ctx, viewport });
                document.getElementById('pageNum').textContent = num;

                // Save last viewed page
                localStorage.setItem(`lastPage_${url}`, num);
            });
        }

        document.getElementById('prevPage').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        });

        document.getElementById('zoomIn').addEventListener('click', () => {
            currentScale *= 1.2;
            renderPage(pageNum);
        });

        document.getElementById('zoomOut').addEventListener('click', () => {
            currentScale /= 1.2;
            renderPage(pageNum);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') document.getElementById('nextPage').click();
            if (e.key === 'ArrowLeft') document.getElementById('prevPage').click();
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const displayWidth = canvas.offsetWidth;
            if (clickX < displayWidth / 2 && pageNum > 1) {
                pageNum--;
                renderPage(pageNum);
            } else if (clickX >= displayWidth / 2 && pageNum < pdfDoc.numPages) {
                pageNum++;
                renderPage(pageNum);
            }
        });

        // BUG FIX: Wait for PDF.js to be loaded and use correct namespace
        document.addEventListener('DOMContentLoaded', function () {
            if (!window['pdfjsLib']) {
                alert('PDF.js library failed to load.');
                return;
            }
            window['pdfjsLib'].getDocument(url).promise.then((pdf) => {
                pdfDoc = pdf;
                document.getElementById('pageCount').textContent = pdf.numPages;

                // Restore last page if available
                const savedPage = parseInt(localStorage.getItem(`lastPage_${url}`), 10);
                pageNum = savedPage && savedPage >= 1 && savedPage <= pdf.numPages ? savedPage : 1;
                renderPage(pageNum);
            }).catch(function (error) {
                alert('Failed to load PDF: ' + error.message);
            });
        });
    </script>

    <script>
    function toggleSection(day) {
        const content = document.getElementById(day + '-content');
        const link = document.getElementById(day + '-link');
        const section = document.getElementById(day + '-section') || event.currentTarget;
        
        if (content.classList.contains('hidden')) {
            document.querySelectorAll('[id$="-content"]').forEach(el => {
                if (el !== content) {
                    el.classList.add('hidden');
                    const otherLink = document.getElementById(el.id.replace('-content', '-link'));
                    if (otherLink) otherLink.textContent = 'Tap to view';
                }
            });
            content.classList.remove('hidden');
            link.textContent = 'Tap to hide';
        } else {
            content.classList.add('hidden');
            link.textContent = 'Tap to view';
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        const dayMapping = {
            0: 'jumapili', 1: 'jumatatu', 2: 'jumanne', 3: 'jumatano', 
            4: 'alhamisi', 5: 'ijumaa', 6: 'jumamosi'
        };
        const currentDayIndex = new Date().getDay();
        const currentDayId = dayMapping[currentDayIndex];
        const allSections = ['jumapili', 'jumatatu', 'jumanne', 'jumatano', 'alhamisi', 'ijumaa', 'jumamosi'];
        allSections.forEach(day => {
            const content = document.getElementById(day + '-content');
            if (content) {
                content.classList.add('hidden');
                const link = document.getElementById(day + '-link');
                if (link) link.textContent = 'Tap to view';
            }
        });
        const currentContent = document.getElementById(currentDayId + '-content');
        if (currentContent) {
            currentContent.classList.remove('hidden');
            const currentLink = document.getElementById(currentDayId + '-link');
            if (currentLink) currentLink.textContent = 'Tap to hide';
        }
    });
    </script>

    <button id="textSizeCycleBtn" type="button" aria-label="Adjust text size" title="Adjust text size (Normal / Large / Extra Large)">A</button>
    <script>
        (function () {
            var order = ['normal', 'large', 'xlarge'];
            var labels = { small: 'A', normal: 'A', large: 'A+', xlarge: 'A++' };
            var btn = document.getElementById('textSizeCycleBtn');
            function apply(size) {
                document.body.classList.remove('text-small', 'text-large', 'text-xlarge');
                if (size !== 'normal') document.body.classList.add('text-' + size);
                btn.textContent = labels[size] || 'A';
                try { localStorage.setItem('textSize', size); } catch (e) {}
            }
            var current = 'normal';
            try { current = localStorage.getItem('textSize') || 'normal'; } catch (e) {}
            apply(current);
            btn.addEventListener('click', function () {
                current = order[(order.indexOf(current) + 1) % order.length];
                apply(current);
            });
        })();
    </script>
