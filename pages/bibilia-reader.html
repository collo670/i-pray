<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7c2133">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ipray">
    <link rel="stylesheet" href="../css/prevent-zoom.css">
    <title>Bibilia Takatifu - ipray</title>
    <link rel="icon" href="../assets/images/favicon.ico.jpg" type="image/x-icon">
    <meta name="description" content="Soma vitabu vyote vya Biblia Takatifu kwa Kiswahili (SUV) kupitia Bolls Bible API.">
    <!-- Tailwind CSS: locally built (npm run build) -->
    <link rel="stylesheet" href="../dist/output.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/index.css">
    <!-- Shared light/dark theme: applies the saved choice before paint -->
    <script src="../js/theme.js"></script>
    <script src="../js/text-size.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/library.js" defer></script>
    <script src="../js/home-button.js" defer></script>
    <script src="../js/reminders.js" defer></script>
    <!-- Splash logo & hero image fetched early -->
    <link rel="preload" as="image" href="../assets/images/logo-small.jpg">
    <link rel="stylesheet" href="../css/status-bar-safe-area.css">
    <script src="../js/status-bar.js" defer></script>
    <style>
        /* Bible reading text scales with the A± control (--prayer-text-scale,
           set by js/text-size.js). The app bar + Home button sit
           outside .reading-body so they never resize. */
        .reading-body {
            font-size: calc(1.1rem * var(--prayer-text-scale, 1));
            line-height: 1.9;
        }
        .bible-verse {
            margin: 0 0 0.55rem;
            text-align: left;
        }
        /* Verse numbers: narrow pill so they don't disrupt the text flow. */
        .verse-num {
            display: inline-block;
            min-width: 1.35em;
            height: 1.35em;
            line-height: 1.35em;
            margin-right: 0.25em;
            margin-left: -0.05em;
            padding: 0 0.22em;
            color: #7c2133;
            font-weight: 700;
            font-size: 0.82em;
            vertical-align: top;
            border-radius: 9999px;
            background: rgba(124, 33, 51, 0.10);
        }
        :root.dark .verse-num { color: #f87171; background: rgba(248, 113, 113, 0.15); }
        .bible-verse sup { font-style: normal; }
        .chapter-nav-btn {
            width: 2.7rem; height: 2.7rem;
            border-radius: 9999px;
            background: var(--surface-1);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            flex-shrink: 0;
        }
        .chapter-nav-btn:disabled { opacity: 0.35; cursor: default; }
        .chapter-nav-btn:not(:disabled):hover { background: var(--surface-2); }
        .bible-loading { opacity: 0.7; }
        .testament-badge {
            display: inline-block;
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.125rem 0.45rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        #bibleContent { scroll-margin-top: 4rem; }
    </style>
    <script src="../js/logo-loader.js"></script>
</head>
<body class="page-index min-h-screen bg-gradient-vintage dark:bg-gray-900 transition-colors duration-300">
    <div id="app" class="relative z-10 page-content">
        <!-- App Bar -->
        <header id="appBar" class="app-bar" role="banner">
            <div class="header-content">
                <div class="flex items-center gap-2">
                    <a href="../index.html" class="app-bar-btn" aria-label="Back to home" title="Back to home">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </a>
                    <div class="app-bar-brand">
                        <h1 id="pageTitle" class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                            Bibilia Takatifu
                        </h1>
                        <p id="pageSubtitle" class="text-xs text-gray-600 dark:text-gray-400">Kiswahili · Swahili Union Version</p>
                    </div>
                </div>
                <button id="darkModeQuickToggle" class="app-bar-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <svg id="darkModeIconSun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 0 018 0z" />
                    </svg>
                    <svg id="darkModeIconMoon" class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9 9 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-5 pb-32 pt-6" role="main">
            <!-- Book header: testament badge, book title, chapter selector -->
            <section class="bible-header mb-5" aria-live="polite" aria-label="Bible book and chapter">
                <div class="flex items-center justify-center mb-2">
                    <h2 id="bookTitle" class="text-center text-2xl font-bold text-gray-800 dark:text-gray-100">Mwanzo</h2>
                </div>

                <!-- Chapter navigation -->
                <div class="flex items-center justify-center gap-3">
                    <button type="button" id="prevChapter" class="chapter-nav-btn" aria-label="Previous chapter">
                        <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <label for="chapterSelect" class="sr-only">Chagua sura</label>
                    <select id="chapterSelect" class="block w-40 text-center text-lg font-semibold rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500"></select>
                    <button type="button" id="nextChapter" class="chapter-nav-btn" aria-label="Next chapter">
                        <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Verse content / loading / error -->
            <div id="bibleContent" class="reading-body text-gray-800 dark:text-gray-200">
                <!-- Verses rendered here by js/bibilia-reader.js -->
            </div>
            <div id="bibleError" class="error-state hidden" role="alert" aria-live="assertive">
                <!-- Error message rendered here by js/bibilia-reader.js -->
            </div>

            <!-- Back to top (appears after scrolling) -->
            <button type="button" id="backToTop" class="fixed bottom-24 right-6 bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-800 rounded-full w-11 h-11 shadow-lg hidden items-center justify-center" aria-label="Back to top">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7 7 7M5 10v10h14V10" />
                </svg>
            </button>
        </main>


        <!-- Dark mode quick toggle -->
        <script>
            (function () {
                var btn = document.getElementById('darkModeQuickToggle');
                if (!btn) return;
                btn.addEventListener('click', function () {
                    window.IPrayTheme.toggle();
                });
            })();
        </script>

        <!-- Main reader logic -->
        <script src="../js/bibilia-reader.js" defer></script>
        <!-- Options menu in the app bar (Home, Prayers, Calendar, Settings) -->
        <script src="../js/app-options.js" defer></script>
        <!-- A± text size control -->
        <script src="../js/text-size-control.js" defer></script>
        <!-- Prevent double-tap zoom on interactive elements -->
        <script src="../js/prevent-zoom.js" defer></script>

        <!-- Show "Back to top" only after the user scrolls down -->
        <script>
            (function () {
                var btn = document.getElementById('backToTop');
                if (!btn) return;
                var toggle = function () {
                    var main = document.querySelector('main');
                    if (!main) return;
                    btn.classList.toggle('hidden', main.scrollTop < 320);
                };
                document.addEventListener('scroll', toggle, { passive: true });
                window.addEventListener('scroll', toggle);
                toggle();
            })();
        </script>
    </div>
</body>
</html>
