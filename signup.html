<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up - ipray - Your prayer Companion</title>
    <link rel="icon" href="/i-pray/assets/images/favicon.ico.jpg" type="image/x-icon">
    <meta name="description" content="Sign up for your ipray account for personalized prayer companion experience">
    <meta name="theme-color" content="linear-gradient(135deg, #035313 0%, #e7d7dc 50%, #62acdd 100%)">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="linear-gradient(135deg, #035313 0%, #e7d7dc 50%, #62acdd 100%)">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="linear-gradient(135deg, #035313 0%, #e7d7dc 50%, #62acdd 100%)">

    <!-- iOS PWA Settings -->

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ipray">
    <link rel="apple-touch-icon" href="/i-pray/assets/images/icon-192x192.png">
    <!-- Tailwind CSS via CDN (will use compiled version at dist/output.css after running: npm run build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'secondary': '#DB2777',
                        'accent': '#F59E0B',
                        'liturgical-purple': '#4A1E8A',
                        'liturgical-white': '#F8F9FA',
                        'liturgical-red': '#C41E3A',
                        'liturgical-green': '#2E7D32',
                        'liturgical-gold': '#FFD700',
                    },
                    backgroundImage: {
                        'vintage-texture': 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23000000\' fill-opacity=\'0.1\'%3E%3Ccircle cx=\'30\' cy=\'30\' r=\'2\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")',
                    },
                    screens: {
                        'xs': '475px',
                        '3xl': '1600px',
                    },
                    animation: {
                        'hamburger-to-x': 'hamburger-to-x 0.3s ease-in-out',
                        'mobile-menu-slide': 'mobile-menu-slide 0.3s ease-in-out',
                    },
                    keyframes: {
                        'hamburger-to-x': {
                            '0%': { transform: 'rotate(0deg) translate(0, 0)' },
                            '50%': { opacity: '0' },
                            '100%': { transform: 'rotate(45deg) translate(-5px, 6px)' },
                        },
                        'mobile-menu-slide': {
                            '0%': { maxHeight: '0', opacity: '0' },
                            '100%': { maxHeight: '500px', opacity: '1' },
                        }
                    },
                    transitionProperty: {
                        'max-height': 'max-height',
                        'transform': 'transform',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Font Awesome with preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css.all.min.css">
    <!-- Plausible Analytics -->
    <script defer data-domain="ipray.app" src="https://plausible.io/js/script.js"></script>
    <!-- Fuse.js for enhanced search -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css">
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<!-- Install Button -->
<div id="installContainer" class="px-6 py-2">
  <button id="installButton" class="hidden w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold rounded-xl shadow-lg text-center" data-translate="installApp">
    Install ipray App
  </button>
</div>
<body class="min-h-screen bg-gradient-vintage transition-colors duration-300">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    <div id="app" class="relative z-10 page-content">
        <!-- Updated Header -->

<main class="max-w-4xl mx-auto px-6 py-8 pb-32 pt-6" role="main">
    <div class="flex justify-center items-center min-h-[60vh]">
        <div class="bg-white shadow-xl rounded-3xl p-8 w-full max-w-md border border-dashed border-purple-200">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h2>
                <p class="text-gray-600">Join our prayer community</p>
            </div>
            <form id="signupForm" class="space-y-6" novalidate>
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm" role="alert">
                    <span class="block sm:inline">Please correct the errors below.</span>
                </div>
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                           placeholder="Enter your full name">
                    <span id="nameError" class="text-red-500 text-sm hidden">This field is required</span>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                           placeholder="Enter your email">
                    <span id="emailError" class="text-red-500 text-sm hidden">Please enter a valid email address</span>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                           placeholder="Create a password (min 8 characters)">
                    <span id="passwordError" class="text-red-500 text-sm hidden">Password must be at least 8 characters</span>
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                           placeholder="Confirm your password">
                    <span id="confirmPasswordError" class="text-red-500 text-sm hidden">Passwords do not match</span>
                </div>
                <div>
                    <button type="submit" id="signupBtn"
                            class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold py-3 px-4 rounded-lg hover:from-purple-700 hover:to-pink-700 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                        Sign Up
                    </button>
                </div>
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or</span>
                        </div>
                    </div>
                    <div class="mt-6">
                        <div id="g_id_onload"
                             data-client_id="YOUR_GOOGLE_CLIENT_ID"
                             data-callback="handleCredentialResponse">
                        </div>
                        <div class="g_id_signin"
                             data-type="standard"
                             data-size="large"
                             data-theme="outline"
                             data-text="sign_in_with"
                             data-shape="rectangular"
                             data-logo_alignment="left">
                        </div>
                    </div>
                </div>
            </form>
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Already have an account? <a href="login.html" class="text-purple-600 hover:text-purple-800 transition-colors font-medium">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</main>
        
    <!-- Main JavaScript -->
    <script src="js/daily-readings.js"></script>
        <!-- Daily Readings Module -->
    <script src="js/daily-readings-module.js"></script>
    <!-- Search Functionality -->
    <script src="js/search.js"></script>
    <!-- Image Optimization -->
    <script src="js/image-optimizer.js"></script>
    <!-- Loading States -->
    <script src="js/loading-states.js"></script>
    <!-- Micro-interactions -->
    <script src="js/micro-interactions.js"></script>
    <!-- Mobile Navigation -->
    <script src="js/mobile-navigation.js"></script>
    <!-- Main JavaScript -->
    <script src="js/index.js"></script>
    <!-- Sign Up Validation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.getElementById('signupForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            const errorMessage = document.getElementById('errorMessage');
            const signupBtn = document.getElementById('signupBtn');

            function showError(element, message) {
                element.textContent = message;
                element.classList.remove('hidden');
            }

            function hideError(element) {
                element.classList.add('hidden');
            }

            function validateField(input, errorElement, validator) {
                if (!input.value.trim()) {
                    showError(errorElement, 'This field is required');
                    return false;
                } else if (validator && !validator(input.value)) {
                    return false; // Validator sets the error
                } else {
                    hideError(errorElement);
                    return true;
                }
            }

            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError(emailError, 'Please enter a valid email address');
                    return false;
                }
                hideError(emailError);
                return true;
            }

            function validatePassword(password) {
                if (password.length < 8) {
                    showError(passwordError, 'Password must be at least 8 characters');
                    return false;
                }
                hideError(passwordError);
                return true;
            }

            function validateConfirmPassword() {
                if (confirmPasswordInput.value !== passwordInput.value) {
                    showError(confirmPasswordError, 'Passwords do not match');
                    return false;
                }
                hideError(confirmPasswordError);
                return true;
            }

            nameInput.addEventListener('blur', () => validateField(nameInput, nameError));
            emailInput.addEventListener('blur', () => validateField(emailInput, emailError, validateEmail));
            passwordInput.addEventListener('blur', () => validateField(passwordInput, passwordError, validatePassword));
            confirmPasswordInput.addEventListener('blur', validateConfirmPassword);

            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const isNameValid = validateField(nameInput, nameError);
                const isEmailValid = validateField(emailInput, emailError, validateEmail);
                const isPasswordValid = validateField(passwordInput, passwordError, validatePassword);
                const isConfirmValid = validateConfirmPassword();

                if (isNameValid && isEmailValid && isPasswordValid && isConfirmValid) {
                    // Simulate sign up process
                    signupBtn.disabled = true;
                    signupBtn.textContent = 'Creating Account...';

                    // Mock success
                    setTimeout(() => {
                        signupBtn.disabled = false;
                        signupBtn.textContent = 'Sign Up';
                        // Redirect to login or index
                        window.location.href = 'login.html';
                    }, 1000);
                } else {
                    errorMessage.classList.remove('hidden');
                }
            });
        });

        // Google Sign-In callback
        function handleCredentialResponse(response) {
            // In a real application, send the JWT to your server for validation
            console.log('Google Sign-In successful', response);
            // For demo purposes, redirect to index.html after successful sign-in
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
